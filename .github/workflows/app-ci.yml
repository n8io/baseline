# The CI every project made from baseline calls, as `ci / <job>` checks:
#   jobs:
#     ci:
#       uses: n8io/baseline/.github/workflows/app-ci.yml@v<major>
# <major> is the Template's major; `pnpm run version` moves the Template's pin (scripts/ci-pin-write.ts).
# No token needed: the @n8io/baseline-* packages install from npmjs. Callers grant `contents: read`.
# Jobs run the project's scripts by their fixed names (its AGENTS.md `## Verify` roles).
# A change that adds a failing check, or adds, renames or removes a job (a required check), ships in
# the next major, never inside the current one.
name: app-ci

on:
  workflow_call:
    inputs:
      artifact:
        description: >-
          Name of an artifact from the calling run that holds app.tar: the project
          directory with its .git, origin/main included. Projects leave it empty and
          the jobs check out the repository.
        default: ""
        type: string
      skip:
        description: >-
          true skips every job, and a skipped job satisfies a required check. baseline's own CI
          passes it when its render did not run; Projects leave it false.
        default: false
        type: boolean

# On a pull request, unit runs only the tests its diff reaches (`pnpm test --changed`), and a diff of
# Markdown alone skips integration, pieces and image. Every other run (the Template's nightly run on
# main, a dispatch, baseline's render) runs everything.
jobs:
  # Whether the pull request changes anything but Markdown. If this job fails or is skipped (baseline's
  # render passes an artifact), the jobs run anyway.
  changes:
    if: ${{ !inputs.skip && inputs.artifact == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: |
          code=true
          if [ -n "$BASE" ]; then
            # Its own line, so a failed diff fails the job (and the jobs run) instead of reading as empty.
            files=$(git diff --name-only --no-renames "$BASE...HEAD")
            if ! grep -qv '\.md$' <<< "$files"; then code=false; fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  # Every check that needs the install and finishes in seconds, in one job: each job bills at least
  # a minute and spends about 25 s on setup. Lint, types and format, then migrations, then oasdiff.
  check:
    if: ${{ !inputs.skip }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - &checkout
        if: inputs.artifact == ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - &download
        if: inputs.artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact }}
      - &extract
        if: inputs.artifact != ''
        run: tar -xf app.tar && rm app.tar
      - &pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - &node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: pnpm
          node-version-file: .node-version
      - &install
        id: install
        run: pnpm install --frozen-lockfile
      - run: timeout 30s pnpm check
      # From here on each check reports even when an earlier one failed.
      - name: src/env.d.ts matches .env.schema
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: git diff --exit-code src/env.d.ts
      # ubuntu-latest ships shellcheck. find runs it only when a script exists.
      - name: Shell scripts pass shellcheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: find . -name '*.sh' -not -path './node_modules/*' -exec shellcheck {} +
      - name: Migrations are consistent
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm exec drizzle-kit check
      - name: Migrations match the tables
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          # A Project with no Domain yet has no table, and drizzle-kit generate refuses an empty schema.
          if ! compgen -G "src/contexts/*/adapters/outbound/*-table.ts" >/dev/null; then exit 0; fi
          pnpm exec drizzle-kit generate
          if [ -n "$(git status --porcelain -- migrations)" ]; then
            git status --porcelain -- migrations
            echo "::error::The tables changed without a migration. Run pnpm codegen and commit migrations/."
            exit 1
          fi
      - name: Migrations already on main are unchanged
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          changed=$(git diff --name-only --no-renames --diff-filter=DMT origin/main...HEAD -- migrations)
          for file in $changed; do
            echo "::error file=$file::Migrations already on main never change; add a new one instead."
          done
          [ -z "$changed" ]
      - name: Destructive SQL has a destructive.md
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          status=0
          for sql in $(git diff --name-only --no-renames --diff-filter=A origin/main...HEAD -- 'migrations/*/migration.sql'); do
            folder=$(dirname "$sql")
            if [ -f "$folder/destructive.md" ]; then continue; fi
            if grep -inE '\bdrop[[:space:]]+(table|column|schema|index|constraint|type|view|sequence)\b|\brename\b|\balter[[:space:]]+column\b[^;]*\btype\b|\bset[[:space:]]+not[[:space:]]+null\b' "$sql"; then
              echo "::error file=$sql::Destructive SQL needs $folder/destructive.md saying why it is safe now."
              status=1
            fi
          done
          exit $status
      - name: Install oasdiff
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          OASDIFF_SHA256: a8023002fcb2eaa7f5758148a9303cb63d33b939886df312268bc0fc7b939140
          OASDIFF_VERSION: 1.35.0
        run: |
          archive="oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/$archive"
          echo "$OASDIFF_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" oasdiff
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: No breaking change inside /api/v1
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm api-check
      # Warnings only: it prints a ::warning annotation per glossary alias in the added lines and exits 0.
      # continue-on-error keeps a crash in the script from failing `check`.
      - name: Glossary aliases in added lines
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        run: pnpm glossary-check

  # Semgrep CE fails on any finding. A suppression is `// nosemgrep: <rule-id> -- <reason>`.
  # The rules are baseline's pinned snapshot of p/typescript, p/nodejs, p/react and p/secrets
  # (.github/semgrep/rules.txt at this workflow's own commit), never fetched live from semgrep.dev.
  # Moving the pin: docs/agents/dependency-updates.md in the Template.
  sast:
    if: ${{ !inputs.skip }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: semgrep/semgrep:1.182.1@sha256:451b3d875c00dac7ed5db5293e584a07de11449a409c10b3c2d2652f429630b6
    env:
      SEMGREP_ENABLE_VERSION_CHECK: "0"
    steps:
      - *checkout
      - *download
      - *extract
      - name: Pinned Semgrep rules
        env:
          PIN: https://raw.githubusercontent.com/${{ job.workflow_repository }}/${{ job.workflow_sha }}/.github/semgrep
        run: |
          set -eu
          curl -fsSL --retry 3 --retry-all-errors -o "$RUNNER_TEMP/rules.sh" "$PIN/rules.sh"
          curl -fsSL --retry 3 --retry-all-errors -o "$RUNNER_TEMP/rules.txt" "$PIN/rules.txt"
          sh "$RUNNER_TEMP/rules.sh" "$RUNNER_TEMP/rules.txt" "$RUNNER_TEMP/semgrep-rules"
      - run: semgrep scan --error --metrics=off --no-rewrite-rule-ids --config "$RUNNER_TEMP/semgrep-rules"

  unit:
    if: ${{ !inputs.skip }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - *checkout
      - *download
      - *extract
      - *pnpm
      - *node
      - *install
      # CI enforces the budget on the command, the job limit is only a backstop.
      # On a pull request, only the tests whose imports reach a changed file; a test declares the
      # files it reads from disk (the Template's AGENTS.md ## Tests). A deleted file reaches no test
      # through a glob, so a pull request that deletes one runs them all.
      - env:
          BASE: ${{ github.event_name == 'pull_request' && inputs.artifact == '' && format('origin/{0}', github.base_ref) || '' }}
        run: |
          if [ -n "$BASE" ] && [ -n "$(git diff --name-only --diff-filter=D "$BASE...HEAD")" ]; then BASE=; fi
          status=0
          timeout 2m pnpm test ${BASE:+--changed "$BASE"} || status=$?
          if [ "$status" -eq 124 ]; then echo "::error::pnpm test went over its 2 min budget (AGENTS.md ## Verify). Make it faster or set a new budget deliberately."; fi
          exit "$status"

  integration:
    needs: changes
    if: ${{ !cancelled() && !inputs.skip && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: baseline
          POSTGRES_PASSWORD: baseline
          POSTGRES_USER: baseline
        # psql over TCP, not pg_isready: Postgres answers on its socket before the post-initdb restart.
        options: >-
          --health-cmd "psql -h 127.0.0.1 -U baseline -c 'select 1'"
          --health-interval 2s --health-timeout 5s --health-retries 30
        ports: ["5432:5432"]
      redis:
        image: redis:8
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 5s --health-retries 30
        ports: ["6379:6379"]
    steps:
      - *checkout
      - *download
      - *extract
      - *pnpm
      - *node
      - *install
      # CI enforces the budget on the command, the job limit is only a backstop.
      - env:
          INTEGRATION_CACHE_URL: redis://localhost:6379
          INTEGRATION_DATABASE_URL: postgres://baseline:baseline@localhost:5432/baseline
        run: |
          status=0
          timeout 4m pnpm test:integration || status=$?
          if [ "$status" -eq 124 ]; then echo "::error::pnpm test:integration went over its 4 min budget (AGENTS.md ## Verify). Make it faster or set a new budget deliberately."; fi
          exit "$status"

  # Each installed piece is removed on a throwaway worktree; check and unit tests must pass without it.
  # A Project that keeps a piece lists it in .template.json `piecesKept`.
  pieces:
    needs: changes
    if: ${{ !cancelled() && !inputs.skip && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - *checkout
      - *download
      - *extract
      - *pnpm
      - *node
      - *install
      - run: pnpm piece-check

  image:
    needs: changes
    if: ${{ !cancelled() && !inputs.skip && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - *checkout
      - *download
      - *extract
      # The Dockerfile installs inside the image, so the runner needs no pnpm or Node.
      - name: Build the image (never pushed)
        run: docker build --tag app:ci .
      - name: Image size within image-budget.json
        run: |
          bytes=$(docker image inspect --format '{{.Size}}' app:ci)
          size=$(( (bytes + 999999) / 1000000 ))
          budget=$(jq -r .megabytes image-budget.json)
          echo "Image: $size MB, budget $budget MB"
          if [ "$size" -gt "$budget" ]; then
            echo "::error file=image-budget.json::The image is $size MB, over the $budget MB budget."
            exit 1
          fi
