# The CI every project made from baseline calls, as `ci / <job>` checks:
#   jobs:
#     ci:
#       uses: n8io/baseline/.github/workflows/app-ci.yml@v6
# v6 needs no token: the @n8io/baseline-* packages install from npmjs. Callers grant `contents: read`.
# Jobs run the project's scripts by their fixed names (its AGENTS.md `## Verify` roles).
# A change that adds a failing check ships as the next major (v7), never inside v6.
name: app-ci

on:
  workflow_call:
    inputs:
      artifact:
        description: >-
          Name of an artifact from the calling run that holds app.tar: the project
          directory with its .git, origin/main included. Projects leave it empty and
          the jobs check out the repository.
        default: ""
        type: string

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - &checkout
        if: inputs.artifact == ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - &download
        if: inputs.artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact }}
      - &extract
        if: inputs.artifact != ''
        run: tar -xf app.tar && rm app.tar
      - &pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - &node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: pnpm
          node-version-file: .node-version
      - &install
        id: install
        run: pnpm install --frozen-lockfile
      - run: timeout 30s pnpm check
      - name: src/env.d.ts matches .env.schema
        run: git diff --exit-code src/env.d.ts

  # Semgrep CE fails on any finding. A suppression is `// nosemgrep: <rule-id> -- <reason>`.
  sast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: semgrep/semgrep:1.182.1@sha256:451b3d875c00dac7ed5db5293e584a07de11449a409c10b3c2d2652f429630b6
    steps:
      - *checkout
      - *download
      - *extract
      - run: >-
          semgrep scan --error --metrics=off
          --config p/typescript --config p/nodejs --config p/react --config p/secrets

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - *checkout
      - *download
      - *extract
      - *pnpm
      - *node
      - *install
      - run: pnpm test

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: baseline
          POSTGRES_PASSWORD: baseline
          POSTGRES_USER: baseline
        # psql over TCP, not pg_isready: Postgres answers on its socket before the post-initdb restart.
        options: >-
          --health-cmd "psql -h 127.0.0.1 -U baseline -c 'select 1'"
          --health-interval 2s --health-timeout 5s --health-retries 30
        ports: ["5432:5432"]
      redis:
        image: redis:8
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 5s --health-retries 30
        ports: ["6379:6379"]
    steps:
      - *checkout
      - *download
      - *extract
      - *pnpm
      - *node
      - *install
      - run: pnpm test:integration
        env:
          INTEGRATION_CACHE_URL: redis://localhost:6379
          INTEGRATION_DATABASE_URL: postgres://baseline:baseline@localhost:5432/baseline

  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - *checkout
      - *download
      - *extract
      - *pnpm
      - *node
      - *install
      # Each migrations check reports even when an earlier one failed.
      - run: pnpm exec drizzle-kit check
      - name: Migrations match the tables
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          # A Project with no Domain yet has no table, and drizzle-kit generate refuses an empty schema.
          if ! compgen -G "src/domains/*/spi/*-table.ts" >/dev/null; then exit 0; fi
          pnpm exec drizzle-kit generate
          if [ -n "$(git status --porcelain -- migrations)" ]; then
            git status --porcelain -- migrations
            echo "::error::The tables changed without a migration. Run pnpm codegen and commit migrations/."
            exit 1
          fi
      - name: Migrations already on main are unchanged
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          changed=$(git diff --name-only --no-renames --diff-filter=DMT origin/main...HEAD -- migrations)
          for file in $changed; do
            echo "::error file=$file::Migrations already on main never change; add a new one instead."
          done
          [ -z "$changed" ]
      - name: Destructive SQL has a destructive.md
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          status=0
          for sql in $(git diff --name-only --no-renames --diff-filter=A origin/main...HEAD -- 'migrations/*/migration.sql'); do
            folder=$(dirname "$sql")
            if [ -f "$folder/destructive.md" ]; then continue; fi
            if grep -inE '\bdrop[[:space:]]+(table|column|schema|index|constraint|type|view|sequence)\b|\brename\b|\balter[[:space:]]+column\b[^;]*\btype\b|\bset[[:space:]]+not[[:space:]]+null\b' "$sql"; then
              echo "::error file=$sql::Destructive SQL needs $folder/destructive.md saying why it is safe now."
              status=1
            fi
          done
          exit $status

  # Each installed piece is removed on a throwaway worktree; check and unit tests must pass without it.
  # A Project that keeps a piece lists it in .template.json `piecesKept`.
  pieces:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - *checkout
      - *download
      - *extract
      - *pnpm
      - *node
      - *install
      - run: pnpm piece-check

  oasdiff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OASDIFF_SHA256: a8023002fcb2eaa7f5758148a9303cb63d33b939886df312268bc0fc7b939140
      OASDIFF_VERSION: 1.35.0
    steps:
      - *checkout
      - *download
      - *extract
      - *pnpm
      - *node
      - *install
      - name: Install oasdiff
        run: |
          archive="oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/$archive"
          echo "$OASDIFF_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" oasdiff
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: No breaking change inside /api/v1
        run: pnpm api-check

  glossary-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - *checkout
      - *download
      - *extract
      - *pnpm
      - *node
      - *install
      - run: pnpm glossary-check

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - *checkout
      - *download
      - *extract
      - *pnpm
      - *node
      - *install
      - name: Build the image (never pushed)
        run: docker build --tag app:ci .
      - name: Image size within image-budget.json
        run: |
          bytes=$(docker image inspect --format '{{.Size}}' app:ci)
          size=$(( (bytes + 999999) / 1000000 ))
          budget=$(jq -r .megabytes image-budget.json)
          echo "Image: $size MB, budget $budget MB"
          if [ "$size" -gt "$budget" ]; then
            echo "::error file=image-budget.json::The image is $size MB, over the $budget MB budget."
            exit 1
          fi
