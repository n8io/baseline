name: ci

# A run on main restores the Turborepo cache, so a merge runs only the tasks it changed, saves it for every pull request,
# and a nightly run on main runs every task with --force.
# workflow_dispatch: main-run starts that run after a Dependabot merge, which a push cannot.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * *"

# A newer run on a ref cancels the older one; each run on main gets a group of its own, so none is cancelled.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# A pull request that changes only Markdown outside apps/app skips integration, render, render-and-test and api-only:
# a skipped job satisfies a required check. packages still runs; Turborepo picks the affected tasks.
# So does the Version packages PR when it only moves Package versions, changelogs and changesets.
jobs:
  # Whether the pull request changes anything but Markdown. If this job fails, the jobs run anyway.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          code=true
          if [ -n "$BASE" ]; then
            # Its own line, so a failed diff fails the job (and the jobs run) instead of reading as empty.
            files=$(git diff --name-only --no-renames "$BASE...HEAD")
            # The Template's Markdown ships to Projects, whose tests read it, so it counts as code here.
            if ! grep -qv '\.md$' <<< "$files" && ! grep -q '^apps/app/' <<< "$files"; then code=false; fi
            # The Version packages PR only moves versions and changelogs of Packages, which the render and
            # piece jobs install from npmjs, never from this checkout. Every other diff there runs everything.
            if [ "$HEAD_REF" = changeset-release/main ] && ! grep -qvE '\.md$|^\.changeset/|^packages/[^/]+/package\.json$' <<< "$files"; then
              versions_only=true
              for file in $(grep '^packages/' <<< "$files" | grep 'package\.json$'); do
                if git diff -U0 "$BASE...HEAD" -- "$file" | grep '^[+-][^+-]' | grep -qv '"version"'; then versions_only=false; fi
              done
              if [ "$versions_only" = true ] && ! grep -q '^apps/app/' <<< "$files"; then code=false; fi
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  packages:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: pnpm
          node-version-file: .node-version
      # Only main saves the cache: one saved on a pull request is readable by that pull request alone.
      # main restores the last one and drops entries older than a week before saving, so it stays small.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: turbo-${{ runner.os }}-${{ github.sha }}
          path: .turbo/cache
          restore-keys: turbo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      # Unused files, exports and dependencies; knip.jsonc says how to settle a finding.
      - run: pnpm knip
      # main runs every task from the restored cache, so its cache holds them all; the nightly run ignores it.
      - run: pnpm turbo run check test build ${{ github.ref != 'refs/heads/main' && '--affected' || (github.event_name == 'schedule' && '--force' || '') }}
      # --affected skips the root tests on a diff only inside packages/, such as a new optional peer
      # that leaves the lockfile alone; this one reads every Package's package.json.
      - if: github.ref != 'refs/heads/main'
        run: pnpm exec vitest run test/dependencies-allowed.test.ts
      # Blocking: fails on glossary aliases in this PR's added lines, for the root CONTEXT.md and for
      # the Template's apps/app glossaries. Runs here, not in app-ci's artifact path, because this job
      # has the real checkout and so a real base. On main there are no added lines to read.
      - if: ${{ !cancelled() && github.ref != 'refs/heads/main' }}
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
      - if: ${{ !cancelled() && github.ref != 'refs/heads/main' }}
        run: node apps/app/scripts/glossary-check.ts CONTEXT.md .
      - if: ${{ !cancelled() && github.ref != 'refs/heads/main' }}
        working-directory: apps/app
        run: pnpm glossary-check
      - if: github.ref == 'refs/heads/main'
        run: find .turbo/cache -type f -mtime +7 -delete
      - if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: turbo-${{ runner.os }}-${{ github.sha }}
          path: .turbo/cache

  # The same Semgrep scan and pinned rules app-ci runs; apps/app is scanned through render-and-test.
  sast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: semgrep/semgrep:1.182.1@sha256:451b3d875c00dac7ed5db5293e584a07de11449a409c10b3c2d2652f429630b6
    env:
      SEMGREP_ENABLE_VERSION_CHECK: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pinned Semgrep rules
        run: sh .github/semgrep/rules.sh .github/semgrep/rules.txt "$RUNNER_TEMP/semgrep-rules"
      - run: >-
          semgrep scan --error --metrics=off --no-rewrite-rule-ids --config "$RUNNER_TEMP/semgrep-rules"
          packages scripts test

  # The template as is, foo included: render drops foo's integration tests, so only this runs them.
  integration:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    services:
      postgres:
        image: postgres:18@sha256:64c8b0d31e4ab6ea665e8426ea406a94bf52de3c05b3a4a8bf713704eefa9328
        env:
          POSTGRES_DB: baseline
          POSTGRES_PASSWORD: baseline
          POSTGRES_USER: baseline
        # psql over TCP, not pg_isready: Postgres answers on its socket before the post-initdb restart.
        options: >-
          --health-cmd "psql -h 127.0.0.1 -U baseline -c 'select 1'"
          --health-interval 2s --health-timeout 5s --health-retries 30
        ports: ["5432:5432"]
      redis:
        image: redis:8@sha256:ca1cb6df9313d0186b68f19b60fc2802e0c76e8542b2c05650b560e7bbb3cc8f
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 5s --health-retries 30
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: pnpm
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      # app-ci's check runs this on each render, which has no foo; this checks foo's SDK.
      - name: The SDK matches the OpenAPI document
        run: |
          pnpm sdk-generate
          if [ -n "$(git status --porcelain -- clients/sdk)" ]; then
            git status --porcelain -- clients/sdk
            echo "::error::apps/app/clients/sdk differs from what pnpm sdk-generate writes. Run it in apps/app and commit clients/sdk/."
            exit 1
          fi
        working-directory: apps/app
      # CI enforces the budget on the command, the job limit is only a backstop.
      - run: |
          status=0
          timeout 4m pnpm test:integration || status=$?
          if [ "$status" -eq 124 ]; then echo "::error::pnpm test:integration went over its 4 min budget (apps/app/AGENTS.md ## Verify). Make it faster or set a new budget deliberately."; fi
          exit "$status"
        working-directory: apps/app

  # The UI tests of apps/app: Playwright, axe and the Lighthouse budget, in a real Chromium against the
  # production build on memory adapters, so no Postgres or Redis. Blocking, like every job here.
  # ui-shot's screenshots go up as an artifact for a reviewer; nothing is committed.
  e2e:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: pnpm
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      # No browser cache: ci.yml's only cache is the Turborepo one on main (test/ci-concurrency.test.ts), and
      # Chromium downloads in seconds.
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/app
      - run: pnpm test:e2e
        working-directory: apps/app
      # Shoots the sign-in page, desktop and phone, to a folder outside the repository.
      - run: pnpm ui-shot --label ci --out "$RUNNER_TEMP/ui-shots"
        working-directory: apps/app
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          if-no-files-found: ignore
          name: ui-shots
          path: ${{ runner.temp }}/ui-shots
          retention-days: 7

  # Renders apps/app as a project would hold it: origin/main is the previous release,
  # HEAD upgrades it to this change and adds contexts, an Event handler and an ACL.
  render:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: pnpm
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - name: Render, upgrade and add the contexts
        run: |
          git config --global user.name "render-and-test"
          git config --global user.email "render-and-test@users.noreply.github.com"
          node test/render/render-and-test.ts "$RUNNER_TEMP/app"
          tar -cf app.tar -C "$RUNNER_TEMP/app" .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: render-and-test
          path: app.tar
          retention-days: 1

  # Runs even when render was skipped or failed, so each of its jobs reports skipped: required checks
  # need a result. A failed render fails the pull request on its own.
  render-and-test:
    needs: render
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/app-ci.yml
    with:
      artifact: render-and-test
      skip: ${{ needs.render.result != 'success' }}

  # pnpm piece-remove on a fresh render: each piece alone, all together, and the way back.
  # One render per case, side by side; `api-only` below is the one required check that gathers them.
  api-only-case:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        case: [alone-1, alone-2, all]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: pnpm
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - name: Render, remove pieces, revert, then check, test, build and serve (${{ matrix.case }})
        env:
          CASE: ${{ matrix.case }}
        run: |
          git config --global user.name "api-only"
          git config --global user.email "api-only@users.noreply.github.com"
          node test/render/api-only.ts "$RUNNER_TEMP/api-only" "$CASE"

  # The required check. Skipped cases (a Markdown-only diff) report skipped, and so does the gate's work.
  api-only:
    needs: api-only-case
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULT: ${{ needs.api-only-case.result }}
        run: |
          echo "api-only cases: $RESULT"
          [ "$RESULT" = success ] || [ "$RESULT" = skipped ]

  # Each Package's Stryker floor (break 90 in its stryker.config.json), one case per Package, side by side.
  # The changes job has no per-Package output, so a pull request runs every floor. Blocking: no continue-on-error.
  # authn, cli, feature-flags, result and telemetry have no Stryker config yet, so they are not here.
  mutation:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        package:
          [
            analytics,
            cache,
            cli,
            error-tracking,
            health,
            http,
            id,
            live,
            logger,
            postgres,
            queue,
            redis,
            sdk,
            shared,
            shutdown,
          ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: pnpm
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      # The Packages it imports resolve to their build, so build those first (not the Package itself).
      - env:
          PACKAGE: ${{ matrix.package }}
        run: pnpm turbo run build --filter="./packages/${PACKAGE}^..."
      # Incremental mode re-runs only the mutants whose code or tests changed; the floor still reads the whole score.
      # Only main saves the file: one saved on a pull request is readable by that pull request alone.
      # A reused result can go stale when a built upstream Package or a dependency changes, so the key holds
      # the lockfile and the nightly run ignores the file (--force) and saves a fresh one.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: stryker-${{ matrix.package }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          path: packages/${{ matrix.package }}/.stryker-incremental.json
          restore-keys: stryker-${{ matrix.package }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm test:mutation ${{ github.event_name == 'schedule' && '--force' || '' }}
        working-directory: packages/${{ matrix.package }}
      - if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: stryker-${{ matrix.package }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          path: packages/${{ matrix.package }}/.stryker-incremental.json

  automerge:
    if: github.event_name == 'pull_request'
    # Every job that gates a merge; test/ci-automerge-needs.test.ts fails when a job is missing.
    # render-and-test is app-ci.yml's check, unit, integration, piece, pieces, image and sast jobs.
    needs:
      [
        api-only,
        api-only-case,
        changes,
        e2e,
        integration,
        mutation,
        packages,
        render,
        render-and-test,
        sast,
      ]
    uses: ./.github/workflows/dependabot-automerge.yml
    permissions:
      contents: write
      pull-requests: write

  # automerge merges with GITHUB_TOKEN, whose push starts no run on main; a dispatch is a run it can start.
  main-run:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    needs: automerge
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      pull-requests: read
    steps:
      - env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          merged=$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER" --jq .merged)
          if [ "$merged" = true ]; then gh workflow run ci.yml --ref main; fi
