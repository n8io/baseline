name: ci

# workflow_dispatch: release.yml starts CI on the Version packages PR, whose
# GITHUB_TOKEN pushes start no pull_request runs.
on: [pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  packages:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: pnpm
          node-version-file: .node-version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: turbo-${{ runner.os }}-${{ github.sha }}
          path: .turbo/cache
          restore-keys: turbo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run check test build --affected

  # The same Semgrep scan app-ci runs; apps/app is scanned through render-and-test.
  sast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: semgrep/semgrep:1.182.1@sha256:451b3d875c00dac7ed5db5293e584a07de11449a409c10b3c2d2652f429630b6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: >-
          semgrep scan --error --metrics=off
          --config p/typescript --config p/nodejs --config p/react --config p/secrets
          packages scripts test

  # The template as is, foo included: render drops foo's integration tests, so only this runs them.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: baseline
          POSTGRES_PASSWORD: baseline
          POSTGRES_USER: baseline
        # psql over TCP, not pg_isready: Postgres answers on its socket before the post-initdb restart.
        options: >-
          --health-cmd "psql -h 127.0.0.1 -U baseline -c 'select 1'"
          --health-interval 2s --health-timeout 5s --health-retries 30
        ports: ["5432:5432"]
      redis:
        image: redis:8
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 5s --health-retries 30
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: pnpm
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration
        working-directory: apps/app

  # Renders apps/app as a project would hold it: origin/main is the previous release,
  # HEAD upgrades it to this change and adds two domains, a consumer and a bridge.
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: pnpm
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - name: Render, upgrade and add the domains
        run: |
          git config --global user.name "render-and-test"
          git config --global user.email "render-and-test@users.noreply.github.com"
          node test/render/render-and-test.ts "$RUNNER_TEMP/app"
          tar -cf app.tar -C "$RUNNER_TEMP/app" .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: render-and-test
          path: app.tar
          retention-days: 1

  render-and-test:
    needs: render
    uses: ./.github/workflows/app-ci.yml
    with:
      artifact: render-and-test

  automerge:
    needs: [integration, packages, render, render-and-test, sast]
    uses: ./.github/workflows/dependabot-automerge.yml
    permissions:
      contents: write
      pull-requests: write
