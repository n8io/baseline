name: release

on:
  push:
    branches: [main]

concurrency:
  cancel-in-progress: false
  group: release

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version-file: .node-version
          registry-url: https://npm.pkg.github.com
      - run: pnpm install --frozen-lockfile
      - id: changesets
        uses: changesets/action@v2
        with:
          commit-message: "🔖 Version packages"
          pr-title: "🔖 Version packages"
          publish-script: pnpm changeset publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Point v<major> at the newest app@<major>.x.y release, so projects on
      # app-ci.yml@v<major> get it.
      - if: steps.changesets.outputs.has-changesets == 'false'
        run: |
          git fetch --force --tags origin
          tag=$(git tag --list 'app@*' --sort=-version:refname | head -n 1)
          if [ -z "$tag" ]; then exit 0; fi
          major="v${tag#app@}"
          major="${major%%.*}"
          # app@0.x (the untagged app's first tag) is not a release.
          if [ "$major" = "v0" ]; then exit 0; fi
          git tag --force "$major" "$tag^{commit}"
          git push --force origin "refs/tags/$major"
