name: release

on:
  push:
    branches: [main]

concurrency:
  cancel-in-progress: false
  group: release

# actions: start ci.yml on the Version packages PR.
# id-token: npm trusted publishing (OIDC), so no npm token is stored.
permissions:
  actions: write
  contents: write
  id-token: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: pnpm
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          commit-message: "🔖 Version packages"
          pr-title: "🔖 Version packages"
          publish-script: pnpm changeset publish
          # changeset version, then Biome, so the generated CHANGELOGs pass `pnpm check`.
          version-script: pnpm run version
        env:
          # Provenance needs n8io/baseline to be public.
          NPM_CONFIG_PROVENANCE: "true"
      # GITHUB_TOKEN pushes start no pull_request runs, but a dispatch does, and its
      # checks attach to the PR's head commit.
      - if: steps.changesets.outputs.pr-number
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref changeset-release/main
      # Point v<major> at the newest app@<major>.x.y release, so projects on
      # app-ci.yml@v<major> get it.
      - if: steps.changesets.outputs.has-changesets == 'false'
        run: |
          git fetch --force --tags origin
          tag=$(git tag --list 'app@*' --sort=-version:refname | head -n 1)
          if [ -z "$tag" ]; then exit 0; fi
          major="v${tag#app@}"
          major="${major%%.*}"
          # app@0.x (the untagged app's first tag) is not a release.
          if [ "$major" = "v0" ]; then exit 0; fi
          git tag --force "$major" "$tag^{commit}"
          git push --force origin "refs/tags/$major"
