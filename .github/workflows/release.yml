name: release

on:
  push:
    branches: [main]

concurrency:
  cancel-in-progress: false
  group: release

# contents: push the v<major> tag.
# id-token: npm trusted publishing (OIDC), so no npm token is stored.
# The Version packages PR, its branch and the release tags use the App token below.
permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: pnpm
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      # Pushes made with GITHUB_TOKEN start no pull_request run, so the Version packages
      # PR would get no checks the main ruleset counts. The release App's token does start
      # one. Without owner or repositories, the token covers this repository only.
      - id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          permission-contents: write
          permission-pull-requests: write
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          commit-message: "🔖 Version packages"
          # Commits, the PR and the tags go through the GitHub API with this token.
          github-token: ${{ steps.app-token.outputs.token }}
          pr-title: "🔖 Version packages"
          publish-script: pnpm changeset publish
          # changeset version, then Biome, so the generated CHANGELOGs pass `pnpm check`.
          version-script: pnpm run version
        env:
          # Provenance needs n8io/baseline to be public.
          NPM_CONFIG_PROVENANCE: "true"
      # Point v<major> at the newest app@<major>.x.y release, so projects on
      # app-ci.yml@v<major> get it.
      - if: steps.changesets.outputs.has-changesets == 'false'
        run: |
          git fetch --force --tags origin
          tag=$(git tag --list 'app@*' --sort=-version:refname | head -n 1)
          if [ -z "$tag" ]; then exit 0; fi
          major="v${tag#app@}"
          major="${major%%.*}"
          # app@0.x (the untagged app's first tag) is not a release.
          if [ "$major" = "v0" ]; then exit 0; fi
          new=$(git rev-parse "$tag^{commit}")
          old=$(git rev-parse -q --verify "refs/tags/$major^{commit}" || true)
          if [ -z "$old" ]; then
            git tag "$major" "$new"
            git push origin "refs/tags/$major"
            exit 0
          fi
          if [ "$old" = "$new" ]; then exit 0; fi
          # Only move forward: a v<major> already ahead of (or beside) the newest app@<major> tag stays put.
          if ! git merge-base --is-ancestor "$old" "$new"; then
            echo "$major is not behind $tag, leaving it"
            exit 0
          fi
          # The lease fails the push if someone moved the tag since the fetch above.
          git tag -f "$major" "$new"
          git push --force-with-lease="refs/tags/$major:$old" origin "refs/tags/$major"
