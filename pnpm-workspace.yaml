packages:
  - apps/*
  - apps/app/clients/*
  - packages/*
# pnpm reads only auth and registry lines from .npmrc; every other setting lives here.
# Peers install only where a manifest lists them, so build-only peers stay out of the image.
autoInstallPeers: false
# Refuse releases younger than a day: hijacked npm releases are usually pulled within hours.
# Our own packages are exempt so a baseline release flows at once.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@n8io/baseline-*"
allowBuilds:
  protobufjs: false
  # piece-start: sdk
  # orval, which pnpm sdk-generate runs, needs no install script.
  esbuild: false
  # piece-end: sdk
  # piece-start: api-reference
  # swagger-ui-dist's only dependency is an install-time analytics script; keep it off.
  "@scarf/scarf": false
  # piece-end: api-reference
# piece-start: ui
# The built server never imports these peers; optional keeps them out of production installs.
packageExtensions:
  react-router-hono-server:
    peerDependenciesMeta:
      "@react-router/dev":
        optional: true
      vite:
        optional: true
# piece-end: ui
