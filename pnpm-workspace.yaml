packages:
  - apps/*
  - packages/*
# pnpm reads only auth and registry lines from .npmrc; every other setting lives here.
# Peers install only where a manifest lists them, so build-only peers stay out of the image.
autoInstallPeers: false
# Refuse releases younger than a day: hijacked npm releases are usually pulled within hours.
# Our own packages are exempt so a baseline release flows at once.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@n8io/baseline-*"
allowBuilds:
  protobufjs: false
# piece-start: ui
# The built server never imports these peers; optional keeps them out of production installs.
packageExtensions:
  react-router-hono-server:
    peerDependenciesMeta:
      "@react-router/dev":
        optional: true
      vite:
        optional: true
# The dev-server plugin (dev only, but installed in the image) pins @hono/node-server ^1 and minimatch ^9,
# and shadcn's ts-morph pins minimatch ^10; all three are open advisories fixed in 2.1.3 and 11.0.1.
# They use only getRequestListener, getConnInfo and the named minimatch export, which the newer majors keep.
# Drop each line once its parent's own range allows the patched version.
overrides:
  "@hono/vite-dev-server>@hono/node-server": ^2.1.6
  "@hono/vite-dev-server>minimatch": ^11.0.1
  "@ts-morph/common>minimatch": ^11.0.1
# piece-end: ui
