name: ci

# workflow_dispatch: app-create runs CI once on a new Project's main.
on: [pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  ci:
    uses: n8io/baseline/.github/workflows/app-ci.yml@v6

  automerge:
    needs: ci
    uses: n8io/baseline/.github/workflows/dependabot-automerge.yml@v6
    permissions:
      contents: write
      pull-requests: write
