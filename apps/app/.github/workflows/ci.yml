name: ci

on: [pull_request]

permissions:
  contents: read
  packages: read

jobs:
  ci:
    uses: n8io/baseline/.github/workflows/app-ci.yml@v1
    secrets: inherit

  automerge:
    needs: ci
    uses: n8io/baseline/.github/workflows/dependabot-automerge.yml@v1
    permissions:
      contents: write
      pull-requests: write
