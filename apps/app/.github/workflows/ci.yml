name: ci

# workflow_dispatch: app-create runs CI once on a new Project's main.
# schedule: a nightly run of every test on main, since a pull request runs only the tests its diff reaches.
on:
  pull_request:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

# A newer run on a ref cancels the older one; each run on main gets a group of its own, so none is cancelled.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: n8io/baseline/.github/workflows/app-ci.yml@v14

  automerge:
    needs: ci
    uses: n8io/baseline/.github/workflows/dependabot-automerge.yml@v14
    permissions:
      contents: write
      pull-requests: write
