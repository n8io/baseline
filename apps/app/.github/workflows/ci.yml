name: ci

# workflow_dispatch: app-create runs CI once on a new Project's main.
on: [pull_request, workflow_dispatch]

# A newer run on a ref cancels the older one; each run on main gets a group of its own, so none is cancelled.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: n8io/baseline/.github/workflows/app-ci.yml@v9

  automerge:
    needs: ci
    uses: n8io/baseline/.github/workflows/dependabot-automerge.yml@v9
    permissions:
      contents: write
      pull-requests: write
