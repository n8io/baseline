name: clients-release

# Publishes the SDK (clients/sdk) and the command line tool (clients/cli) to GitHub Packages, this
# repository's own npm registry, never public npm, after each push to main that changed them:
# scripts/clients-release.ts picks the version, docs/agents/clients.md says how. Off, and green,
# until the repository variable CLIENTS_NPM_SCOPE names the scope: this repository's owner.
# workflow_dispatch: a run by hand, to check it after turning it on.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One publish at a time, never cancelled mid-run. A run still waiting gives way to a newer one,
# which compares against what is published, so nothing is lost.
concurrency:
  group: clients-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  off:
    if: vars.CLIENTS_NPM_SCOPE == ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "::notice::CLIENTS_NPM_SCOPE is not set, so nothing is published. docs/agents/clients.md says how to turn publishing on."

  publish:
    # Only main publishes.
    if: vars.CLIENTS_NPM_SCOPE != '' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # packages: GitHub Packages takes the workflow's own GITHUB_TOKEN, so no token is stored.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: pnpm
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      # npm reads the token from the environment when it calls npm.pkg.github.com, and only then.
      - run: echo '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' >> ~/.npmrc
      - run: node scripts/clients-release.ts
        env:
          CLIENTS_NPM_SCOPE: ${{ vars.CLIENTS_NPM_SCOPE }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
