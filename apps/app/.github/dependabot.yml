version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      baseline:
        patterns: ["@n8io/baseline-*"]
  # The Dockerfile's base image digest.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  # Major bumps of app-ci.yml (v1 to v2).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
