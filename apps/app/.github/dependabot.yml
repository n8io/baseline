version: 2

registries:
  github-packages:
    type: npm-registry
    url: https://npm.pkg.github.com
    token: ${{secrets.PACKAGES_TOKEN}}
    replaces-base: true

updates:
  - package-ecosystem: npm
    directory: /
    registries: [github-packages]
    schedule:
      interval: weekly
    groups:
      baseline:
        patterns: ["@n8io/baseline-*"]
  # The Dockerfile's base image digest.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  # Major bumps of app-ci.yml (v1 to v2).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
