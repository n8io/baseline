version: 2

# Patch and minor updates merge themselves once CI passes (ci.yml `automerge`). Each major is its
# own PR for a human. Security updates skip the cooldown; pnpm's minimumReleaseAge still holds.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      exclude: ["@n8io/baseline-*"]
    groups:
      baseline:
        patterns: ["@n8io/baseline-*"]
      minor-and-patch:
        update-types: [minor, patch]
  # The Dockerfile's base image digest.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  # Major bumps of app-ci.yml (v1 to v2).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
