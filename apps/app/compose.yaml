# Local services: `pnpm dev` runs them; by hand, `varlock run -- docker compose -p app up -d`.
# Every compose command passes `-p` (the Project's name): without it a second Project's stack replaces this one.
# `--profile telemetry` adds a local trace and log viewer (Grafana on http://localhost:3001).
# `--profile image` runs the production image's entries against these services.
name: app

services:
  postgres:
    image: ${IMAGE_REGISTRY:-}postgres:18
    environment:
      POSTGRES_DB: baseline
      POSTGRES_PASSWORD: baseline
      POSTGRES_USER: baseline
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baseline"]
      interval: 2s
      retries: 15

  # piece-start: redis
  redis:
    image: ${IMAGE_REGISTRY:-}redis:8
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 15
  # piece-end: redis

  otel:
    image: ${IMAGE_REGISTRY:-}grafana/otel-lgtm:0.40.0
    profiles: [telemetry]
    ports:
      - "3001:3000"
      - "4317:4317"
      - "4318:4318"

  server:
    build: .
    profiles: [image]
    depends_on:
      postgres: { condition: service_healthy }
      # piece-start: redis
      redis: { condition: service_healthy }
      # piece-end: redis
    environment: &image-env
      APP_ENV: test
      DATABASE_URL: postgres://baseline:baseline@postgres:5432/baseline
      # piece-start: redis
      CACHE_URL: redis://redis:6379
      # piece-end: redis
      OTEL_SERVICE_NAME: app-server
    ports:
      - "${SERVER_HOST_PORT:-3000}:3000"
      - "${HEALTH_HOST_PORT:-9000}:9000"
    # The shutdown deadline is 25 s; Docker's default 10 s would cut it off.
    stop_grace_period: 30s

  # piece-start: queue
  worker:
    build: .
    profiles: [image]
    command: ["node", "src/worker.ts"]
    depends_on:
      postgres: { condition: service_healthy }
      # piece-start: redis
      redis: { condition: service_healthy }
      # piece-end: redis
    environment:
      <<: *image-env
      OTEL_SERVICE_NAME: app-worker
    stop_grace_period: 30s
  # piece-end: queue
