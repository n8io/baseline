<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-label="A cache read three ways: a stored value the schema accepts comes back; one in an older shape reads as a miss; a store that is down reads as a miss and is counted">
<title>A cache read three ways: a stored value the schema accepts comes back; one in an older shape reads as a miss; a store that is down reads as a miss and is counted</title>
<style>
.display{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#DCEBF7}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#DCEBF7}
.dim{fill:#86A3BE}
.accent{fill:#F5B544}
.ok{fill:#6CD4A0}
.fail{fill:#FF7A6B}

@media (prefers-reduced-motion: no-preference){
@keyframes get{0%,100%{stroke:#5FA8D3}1.67%,10.00%{stroke:#5FA8D3}4.17%{stroke:#F5B544}35.00%,43.33%{stroke:#5FA8D3}37.50%{stroke:#F5B544}66.67%,75.00%{stroke:#5FA8D3}69.17%{stroke:#F5B544}}.get rect{animation:get 12s linear infinite}
@keyframes store{0%,100%{stroke:#5FA8D3}9.62%,17.95%{stroke:#5FA8D3}12.12%{stroke:#F5B544}43.50%,51.83%{stroke:#5FA8D3}46.00%{stroke:#F5B544}74.15%,82.49%{stroke:#5FA8D3}76.65%{stroke:#F5B544}}.store rect{animation:store 12s linear infinite}
@keyframes schema{0%,100%{stroke:#5FA8D3}18.02%,26.35%{stroke:#5FA8D3}20.52%{stroke:#F5B544}52.43%,60.76%{stroke:#5FA8D3}54.93%{stroke:#F5B544}}.schema rect{animation:schema 12s linear infinite}
}
@media (prefers-reduced-motion: reduce){.typed{clip-path:none}.moving{display:none}}
</style>
<rect width="880" height="300" rx="6" fill="#0C1C30"/>
<defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M0 0V20M0 0H20" fill="none" stroke="#14304F" stroke-width="2"/></pattern></defs><rect width="880" height="300" rx="6" fill="url(#grid)"/>
<text x="40" y="40" class="display" font-size="15" font-weight="700">fooCache.get(id)</text>
<path d="M115 150 H640 L690 80" fill="none" stroke="#5FA8D3" stroke-width="1.5" stroke-dasharray="4 5"/>
<path d="M115 150 H690" fill="none" stroke="#5FA8D3" stroke-width="1.5" stroke-dasharray="4 5"/>
<path d="M115 150 H345 V220 H690" fill="none" stroke="#5FA8D3" stroke-width="1.5" stroke-dasharray="4 5"/>
<g class="get"><rect x="30" y="122" width="170" height="56" rx="2" fill="#10243D" stroke="#5FA8D3" stroke-width="1.5"/><text x="115" y="148" text-anchor="middle" class="display" font-size="14" font-weight="600">get(id)</text><text x="115" y="165" text-anchor="middle" class="mono dim" font-size="11">your code</text></g>
<g class="store"><rect x="250" y="122" width="190" height="56" rx="2" fill="#10243D" stroke="#5FA8D3" stroke-width="1.5"/><text x="345" y="148" text-anchor="middle" class="display" font-size="14" font-weight="600">CacheStore</text><text x="345" y="165" text-anchor="middle" class="mono dim" font-size="11">key &lt;prefix&gt;:&lt;id&gt;</text></g>
<g class="schema"><rect x="490" y="122" width="150" height="56" rx="2" fill="#10243D" stroke="#5FA8D3" stroke-width="1.5"/><text x="565" y="148" text-anchor="middle" class="display" font-size="14" font-weight="600">schema</text><text x="565" y="165" text-anchor="middle" class="mono dim" font-size="11">Standard Schema</text></g>
<g class=""><rect x="690" y="54" width="170" height="52" rx="2" fill="#10243D" stroke="#6CD4A0" stroke-width="1.5"/><text x="775" y="78" text-anchor="middle" class="display" font-size="14" font-weight="600">value</text><text x="775" y="95" text-anchor="middle" class="mono dim" font-size="11">the schema's output</text></g>
<g class=""><rect x="690" y="124" width="170" height="52" rx="2" fill="#10243D" stroke="#F5B544" stroke-width="1.5"/><text x="775" y="148" text-anchor="middle" class="display" font-size="14" font-weight="600">miss</text><text x="775" y="165" text-anchor="middle" class="mono dim" font-size="11">an older shape</text></g>
<g class=""><rect x="690" y="194" width="170" height="52" rx="2" fill="#10243D" stroke="#FF7A6B" stroke-width="1.5"/><text x="775" y="218" text-anchor="middle" class="display" font-size="14" font-weight="600">miss</text><text x="775" y="235" text-anchor="middle" class="mono dim" font-size="11">store down, counted</text></g>
<circle class="moving" r="7" fill="#6CD4A0"><animateMotion dur="12s" repeatCount="indefinite" path="M115 150 H640 L690 80" keyPoints="0;0;1;1" keyTimes="0;0.033;0.267;1" calcMode="linear"/><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.023;0.033;0.267;0.307;1"/></circle>
<circle class="moving" r="7" fill="#F5B544"><animateMotion dur="12s" repeatCount="indefinite" path="M115 150 H690" keyPoints="0;0;1;1" keyTimes="0;0.367;0.600;1" calcMode="linear"/><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.357;0.367;0.600;0.640;1"/></circle>
<circle class="moving" r="7" fill="#FF7A6B"><animateMotion dur="12s" repeatCount="indefinite" path="M115 150 H345 V220 H690" keyPoints="0;0;1;1" keyTimes="0;0.683;0.917;1" calcMode="linear"/><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.673;0.683;0.917;0.957;1"/></circle>
<text x="30" y="282" class="mono dim" font-size="12">A store that fails or times out reads as a miss and counts on baseline.cache.store_errors.</text>
</svg>
