<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 428" width="880" height="428" role="img" aria-label="Pieces are optional parts of the stack. Four recipes play in turn: remove the UI pages; remove live updates, the cache and Redis; remove the queue and Worker; remove analytics and error reports">
<title>Pieces are optional parts of the stack. Four recipes play in turn: remove the UI pages; remove live updates, the cache and Redis; remove the queue and Worker; remove analytics and error reports</title>
<style>
.display{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#F7EEE6}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#F7EEE6}
.dim{fill:#B09C8E}
.accent{fill:#FF5A36}
.ok{fill:#7BDCB5}
.fail{fill:#FF4D6D}

@media (prefers-reduced-motion: no-preference){
@keyframes lift0{0%{transform:translateY(0);opacity:1}5.83%{transform:translateY(0);opacity:1}8.33%,21.67%{transform:translateY(-46px);opacity:0.45}23.75%{transform:translateY(0);opacity:1}100%{transform:translateY(0);opacity:1}}.lift0{animation:lift0 24s ease-in-out infinite}

@keyframes lift2{0%{transform:translateY(0);opacity:1}30.83%{transform:translateY(0);opacity:1}33.33%,46.67%{transform:translateY(-46px);opacity:0.45}48.75%{transform:translateY(0);opacity:1}100%{transform:translateY(0);opacity:1}}.lift2{animation:lift2 24s ease-in-out infinite}
@keyframes lift3{0%{transform:translateY(0);opacity:1}30.83%{transform:translateY(0);opacity:1}33.33%,46.67%{transform:translateY(-46px);opacity:0.45}48.75%{transform:translateY(0);opacity:1}100%{transform:translateY(0);opacity:1}}.lift3{animation:lift3 24s ease-in-out infinite}
@keyframes lift4{0%{transform:translateY(0);opacity:1}30.83%{transform:translateY(0);opacity:1}33.33%,46.67%{transform:translateY(-46px);opacity:0.45}48.75%{transform:translateY(0);opacity:1}100%{transform:translateY(0);opacity:1}}.lift4{animation:lift4 24s ease-in-out infinite}
@keyframes lift5{0%{transform:translateY(0);opacity:1}55.83%{transform:translateY(0);opacity:1}58.33%,71.67%{transform:translateY(-46px);opacity:0.45}73.75%{transform:translateY(0);opacity:1}100%{transform:translateY(0);opacity:1}}.lift5{animation:lift5 24s ease-in-out infinite}
@keyframes lift6{0%{transform:translateY(0);opacity:1}80.83%{transform:translateY(0);opacity:1}83.33%,96.67%{transform:translateY(-46px);opacity:0.45}98.75%{transform:translateY(0);opacity:1}100%{transform:translateY(0);opacity:1}}.lift6{animation:lift6 24s ease-in-out infinite}
@keyframes lift7{0%{transform:translateY(0);opacity:1}80.83%{transform:translateY(0);opacity:1}83.33%,96.67%{transform:translateY(-46px);opacity:0.45}98.75%{transform:translateY(0);opacity:1}100%{transform:translateY(0);opacity:1}}.lift7{animation:lift7 24s ease-in-out infinite}
@keyframes scene0{0%{opacity:1}1.67%,23.33%{opacity:1}24.58%,100%{opacity:0}}.scene0{animation:scene0 24s linear infinite}
@keyframes scene1{0%,25.00%{opacity:0}26.67%,48.33%{opacity:1}49.58%,100%{opacity:0}}.scene1{animation:scene1 24s linear infinite}
@keyframes scene2{0%,50.00%{opacity:0}51.67%,73.33%{opacity:1}74.58%,100%{opacity:0}}.scene2{animation:scene2 24s linear infinite}
@keyframes scene3{0%,75.00%{opacity:0}76.67%,98.33%{opacity:1}99.58%,100%{opacity:0}}.scene3{animation:scene3 24s linear infinite}
}
@media (prefers-reduced-motion: reduce){.typed{clip-path:none}.moving{display:none}}
</style>
<rect width="880" height="428" rx="18" fill="#15100E"/>
<text x="30" y="44" class="display" font-size="17" font-weight="700">Pieces: the parts of the stack you can take out</text>
<text x="30" y="68" class="mono dim" font-size="12">A piece is its files, code blocks, packages, env vars and services. One command removes it,</text>
<text x="30" y="86" class="mono dim" font-size="12">then runs pnpm check; git revert and pnpm install bring it back.</text>
<g class="lift0" style="transform:translateY(-46px);opacity:0.45"><g class=""><rect x="30" y="214" width="99" height="44" rx="14" fill="#221915" stroke="#55433A" stroke-width="1.5"/><text x="79.5" y="241" text-anchor="middle" class="display" font-size="11" font-weight="600">ui</text></g></g>
<g class=""><rect x="133" y="214" width="99" height="44" rx="14" fill="#221915" stroke="#55433A" stroke-width="1.5"/><text x="182.5" y="241" text-anchor="middle" class="display" font-size="11" font-weight="600">api-reference</text></g>
<g class="lift2"><g class=""><rect x="236" y="214" width="99" height="44" rx="14" fill="#221915" stroke="#55433A" stroke-width="1.5"/><text x="285.5" y="241" text-anchor="middle" class="display" font-size="11" font-weight="600">live</text></g></g>
<g class="lift3"><g class=""><rect x="339" y="214" width="99" height="44" rx="14" fill="#221915" stroke="#55433A" stroke-width="1.5"/><text x="388.5" y="241" text-anchor="middle" class="display" font-size="11" font-weight="600">cache</text></g></g>
<g class="lift4"><g class=""><rect x="442" y="214" width="99" height="44" rx="14" fill="#221915" stroke="#55433A" stroke-width="1.5"/><text x="491.5" y="241" text-anchor="middle" class="display" font-size="11" font-weight="600">redis</text></g></g>
<g class="lift5"><g class=""><rect x="545" y="214" width="99" height="44" rx="14" fill="#221915" stroke="#55433A" stroke-width="1.5"/><text x="594.5" y="241" text-anchor="middle" class="display" font-size="11" font-weight="600">queue</text></g></g>
<g class="lift6"><g class=""><rect x="648" y="214" width="99" height="44" rx="14" fill="#221915" stroke="#55433A" stroke-width="1.5"/><text x="697.5" y="241" text-anchor="middle" class="display" font-size="11" font-weight="600">analytics</text></g></g>
<g class="lift7"><g class=""><rect x="751" y="214" width="99" height="44" rx="14" fill="#221915" stroke="#55433A" stroke-width="1.5"/><text x="800.5" y="241" text-anchor="middle" class="display" font-size="11" font-weight="600">error-tracking</text></g></g>
<g class=""><rect x="30" y="266" width="820" height="44" rx="14" fill="#2C211C" stroke="#55433A" stroke-width="1.5"/><text x="440" y="293" text-anchor="middle" class="display" font-size="13" font-weight="600">the core: Domains · API · Use cases · Postgres · sign-in · telemetry · health</text></g>
<rect x="30" y="318" width="820" height="84" rx="14" fill="#221915" stroke="#55433A"/>
<g class="scene0"><text x="30" y="116" class="display accent" font-size="12" font-weight="700">RECIPE 1 OF 4</text><text x="30" y="144" class="display" font-size="22" font-weight="800">An API with no pages</text><text x="50" y="344" class="mono" font-size="13">$ pnpm piece-remove ui</text><text x="830" y="344" text-anchor="end" class="display ok" font-size="14" font-weight="600">The API, sign-in, live update streams and the Worker stay.</text></g>
<g class="scene1" style="opacity:0"><text x="30" y="116" class="display accent" font-size="12" font-weight="700">RECIPE 2 OF 4</text><text x="30" y="144" class="display" font-size="22" font-weight="800">No Redis to run</text><text x="50" y="344" class="mono" font-size="13">$ pnpm piece-remove live</text><text x="50" y="364" class="mono" font-size="13">$ pnpm piece-remove cache</text><text x="50" y="384" class="mono" font-size="13">$ pnpm piece-remove redis</text><text x="290" y="344" class="mono dim" font-size="12"># then commit</text><text x="290" y="364" class="mono dim" font-size="12"># then commit</text><text x="290" y="384" class="mono dim" font-size="12"># then commit</text><text x="830" y="344" text-anchor="end" class="display ok" font-size="14" font-weight="600">Postgres is the only data store; every read goes to it.</text></g>
<g class="scene2" style="opacity:0"><text x="30" y="116" class="display accent" font-size="12" font-weight="700">RECIPE 3 OF 4</text><text x="30" y="144" class="display" font-size="22" font-weight="800">No Worker to run</text><text x="50" y="344" class="mono" font-size="13">$ pnpm piece-remove queue</text><text x="830" y="344" text-anchor="end" class="display ok" font-size="14" font-weight="600">One long-running process: no Worker, Events or Schedules.</text></g>
<g class="scene3" style="opacity:0"><text x="30" y="116" class="display accent" font-size="12" font-weight="700">RECIPE 4 OF 4</text><text x="30" y="144" class="display" font-size="22" font-weight="800">No analytics or error-report vendors</text><text x="50" y="344" class="mono" font-size="13">$ pnpm piece-remove analytics</text><text x="50" y="364" class="mono" font-size="13">$ pnpm piece-remove error-tracking</text><text x="290" y="344" class="mono dim" font-size="12"># then commit</text><text x="290" y="364" class="mono dim" font-size="12"># then commit</text><text x="830" y="344" text-anchor="end" class="display ok" font-size="14" font-weight="600">No product analytics or error tracking; errors are still logged.</text></g>
</svg>
