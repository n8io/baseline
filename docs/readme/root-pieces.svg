<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-label="Eight pieces sit on the core; pnpm piece-remove live lifts the live piece out and pnpm check passes">
<title>Eight pieces sit on the core; pnpm piece-remove live lifts the live piece out and pnpm check passes</title>
<style>
.display{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#F7EEE6}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#F7EEE6}
.dim{fill:#B09C8E}
.accent{fill:#FF5A36}
.ok{fill:#7BDCB5}
.fail{fill:#FF4D6D}

@media (prefers-reduced-motion: no-preference){
@keyframes lift{0%,28.00%{transform:translateY(0)}36.00%,92%{transform:translateY(-50px)}97%,100%{transform:translateY(0)}}
.lifted{animation:lift 10s ease-in-out infinite}
@keyframes report{0%,38.00%{opacity:0}41.00%,92%{opacity:1}97%,100%{opacity:0}}
.report{animation:report 10s linear infinite}
}
@media (prefers-reduced-motion: reduce){.typed{clip-path:none}.moving{display:none}}
</style>
<rect width="880" height="300" rx="18" fill="#15100E"/>
<text x="30" y="44" class="display" font-size="15" font-weight="700">Take out what you do not use</text>
<text x="850" y="44" text-anchor="end" class="mono dim" font-size="12">8 pieces · 1 command each</text>
<g class=""><rect x="30" y="128" width="99" height="44" rx="14" fill="#221915" stroke="#55433A" stroke-width="1.5"/><text x="79.5" y="155" text-anchor="middle" class="display" font-size="11" font-weight="600">ui</text></g>
<g class=""><rect x="133" y="128" width="99" height="44" rx="14" fill="#221915" stroke="#55433A" stroke-width="1.5"/><text x="182.5" y="155" text-anchor="middle" class="display" font-size="11" font-weight="600">api-reference</text></g>
<g class="lifted" style="transform:translateY(-50px)"><g class=""><rect x="236" y="128" width="99" height="44" rx="14" fill="#221915" stroke="#FF5A36" stroke-width="1.5"/><text x="285.5" y="155" text-anchor="middle" class="display" font-size="11" font-weight="600">live</text></g></g>
<g class=""><rect x="339" y="128" width="99" height="44" rx="14" fill="#221915" stroke="#55433A" stroke-width="1.5"/><text x="388.5" y="155" text-anchor="middle" class="display" font-size="11" font-weight="600">cache</text></g>
<g class=""><rect x="442" y="128" width="99" height="44" rx="14" fill="#221915" stroke="#55433A" stroke-width="1.5"/><text x="491.5" y="155" text-anchor="middle" class="display" font-size="11" font-weight="600">redis</text></g>
<g class=""><rect x="545" y="128" width="99" height="44" rx="14" fill="#221915" stroke="#55433A" stroke-width="1.5"/><text x="594.5" y="155" text-anchor="middle" class="display" font-size="11" font-weight="600">queue</text></g>
<g class=""><rect x="648" y="128" width="99" height="44" rx="14" fill="#221915" stroke="#55433A" stroke-width="1.5"/><text x="697.5" y="155" text-anchor="middle" class="display" font-size="11" font-weight="600">analytics</text></g>
<g class=""><rect x="751" y="128" width="99" height="44" rx="14" fill="#221915" stroke="#55433A" stroke-width="1.5"/><text x="800.5" y="155" text-anchor="middle" class="display" font-size="11" font-weight="600">error-tracking</text></g>
<g class=""><rect x="30" y="180" width="820" height="44" rx="14" fill="#2C211C" stroke="#55433A" stroke-width="1.5"/><text x="440" y="207" text-anchor="middle" class="display" font-size="13" font-weight="600">the core: Domains · API · Use cases · Postgres · sign-in · telemetry · health</text></g>
<clipPath id="pieces-command"><rect x="30" y="241" width="0" height="23"><animate attributeName="width" dur="10s" repeatCount="indefinite" values="0;0;211;211;0;0" keyTimes="0.000;0.060;0.220;0.920;0.970;1.000"/></rect></clipPath><text x="30" y="258" class="typed mono " font-size="14" clip-path="url(#pieces-command)"><tspan class="accent">$ </tspan>pnpm piece-remove live</text>
<g class="report"><text x="290" y="258" class="mono ok" font-size="13">Removed live; pnpm check passes.</text></g>
<text x="30" y="286" class="mono dim" font-size="12">The pieces CI job proves each one still comes out, on every pull request that changes code.</text>
</svg>
