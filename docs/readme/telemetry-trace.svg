<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" role="img" aria-label="One trace as a waterfall: on the Server, the request span, the fooCreate Use case span and its two queries; the published Event carries the trace to the Worker, where the Event handler's Use case and its query join the same trace">
<title>One trace as a waterfall: on the Server, the request span, the fooCreate Use case span and its two queries; the published Event carries the trace to the Worker, where the Event handler's Use case and its query join the same trace</title>
<style>
.display{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#DCEBF7}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#DCEBF7}
.dim{fill:#86A3BE}
.accent{fill:#F5B544}
.ok{fill:#6CD4A0}
.fail{fill:#FF7A6B}

@media (prefers-reduced-motion: no-preference){
@keyframes grow0{0%,6.00%{transform:scaleX(0)}39.60%,92.00%{transform:scaleX(1)}97.00%,100%{transform:scaleX(0)}}.grow0{transform-box:fill-box;transform-origin:left;animation:grow0 10s linear infinite}
@keyframes grow1{0%,7.80%{transform:scaleX(0)}37.20%,92.00%{transform:scaleX(1)}97.00%,100%{transform:scaleX(0)}}.grow1{transform-box:fill-box;transform-origin:left;animation:grow1 10s linear infinite}
@keyframes grow2{0%,10.20%{transform:scaleX(0)}20.40%,92.00%{transform:scaleX(1)}97.00%,100%{transform:scaleX(0)}}.grow2{transform-box:fill-box;transform-origin:left;animation:grow2 10s linear infinite}
@keyframes grow3{0%,22.20%{transform:scaleX(0)}31.20%,92.00%{transform:scaleX(1)}97.00%,100%{transform:scaleX(0)}}.grow3{transform-box:fill-box;transform-origin:left;animation:grow3 10s linear infinite}
@keyframes grow4{0%,43.20%{transform:scaleX(0)}66.00%,92.00%{transform:scaleX(1)}97.00%,100%{transform:scaleX(0)}}.grow4{transform-box:fill-box;transform-origin:left;animation:grow4 10s linear infinite}
@keyframes grow5{0%,45.60%{transform:scaleX(0)}54.00%,92.00%{transform:scaleX(1)}97.00%,100%{transform:scaleX(0)}}.grow5{transform-box:fill-box;transform-origin:left;animation:grow5 10s linear infinite}
@keyframes handoff{0%,35.20%,92.00%,100%{opacity:0.25}43.20%,90.00%{opacity:1}}.handoff{animation:handoff 10s linear infinite}
}
@media (prefers-reduced-motion: reduce){.typed{clip-path:none}.moving{display:none}}
</style>
<rect width="880" height="380" rx="6" fill="#0C1C30"/>
<defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M0 0V20M0 0H20" fill="none" stroke="#14304F" stroke-width="2"/></pattern></defs><rect width="880" height="380" rx="6" fill="url(#grid)"/>
<text x="40" y="44" class="display" font-size="15" font-weight="700">One trace, from the request to the Event handler</text>
<text x="40" y="72" class="mono dim" font-size="12">trace_id 4bf92f3577b34da6a3ce929d0e0e4736</text>
<path d="M330 84 H840" stroke="#5FA8D3" stroke-opacity="0.4"/>
<path d="M40 240 H840" stroke="#5FA8D3" stroke-opacity="0.4" stroke-dasharray="3 4"/>
<text x="40" y="119" class="mono dim" font-size="11">Server</text><text x="110" y="119" class="mono accent" font-size="11">http</text><text x="180" y="119" class="mono" font-size="12">POST /api/v1/foos</text><rect class="grow0" x="330" y="104" width="285.6" height="20" rx="2" fill="#5FA8D3" fill-opacity="0.85"/>
<text x="40" y="155" class="mono dim" font-size="11">Server</text><text x="110" y="155" class="mono accent" font-size="11">use case</text><text x="180" y="155" class="mono" font-size="12">fooCreate</text><rect class="grow1" x="345.3" y="140" width="249.90000000000003" height="20" rx="2" fill="#F5B544" fill-opacity="0.85"/>
<text x="40" y="191" class="mono dim" font-size="11">Server</text><text x="110" y="191" class="mono accent" font-size="11">pg</text><text x="180" y="191" class="mono" font-size="12">INSERT foo</text><rect class="grow2" x="365.7" y="176" width="86.69999999999999" height="20" rx="2" fill="#5FA8D3" fill-opacity="0.85"/>
<text x="40" y="227" class="mono dim" font-size="11">Server</text><text x="110" y="227" class="mono accent" font-size="11">pg</text><text x="180" y="227" class="mono" font-size="12">publish foo.created</text><rect class="grow3" x="467.70000000000005" y="212" width="76.5" height="20" rx="2" fill="#5FA8D3" fill-opacity="0.85"/>
<text x="40" y="263" class="mono dim" font-size="11">Worker</text><text x="110" y="263" class="mono accent" font-size="11">use case</text><text x="180" y="263" class="mono" font-size="12">the Event handler's Use case</text><rect class="grow4" x="646.2" y="248" width="193.79999999999995" height="20" rx="2" fill="#F5B544" fill-opacity="0.85"/>
<text x="40" y="299" class="mono dim" font-size="11">Worker</text><text x="110" y="299" class="mono accent" font-size="11">pg</text><text x="180" y="299" class="mono" font-size="12">INSERT inbox</text><rect class="grow5" x="666.6" y="284" width="71.39999999999998" height="20" rx="2" fill="#5FA8D3" fill-opacity="0.85"/>
<path class="handoff" d="M544.2 222 H632.2 V258 H646.2" fill="none" stroke="#F5B544" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="626.2" y="234" text-anchor="end" class="mono accent handoff" font-size="11">the Event carries the trace</text>
<text x="40" y="340" class="mono dim" font-size="12">Each log line carries the same trace id. Probes are never traced; a query outside a trace makes no span.</text>
<text x="40" y="360" class="mono dim" font-size="12">Before export, URL query values are redacted and exception messages are dropped.</text>
</svg>
