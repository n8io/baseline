<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 410" width="880" height="410" role="img" aria-label="Shutdown on a 25 second timeline: a 5 second drain while /readyz answers 503, then the http and live intakes close together, then queue, database, health and telemetry close one by one, and the process exits 0, well before the 20 second cutoff and the 25 second deadline">
<title>Shutdown on a 25 second timeline: a 5 second drain while /readyz answers 503, then the http and live intakes close together, then queue, database, health and telemetry close one by one, and the process exits 0, well before the 20 second cutoff and the 25 second deadline</title>
<style>
.display{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#DCEBF7}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#DCEBF7}
.dim{fill:#86A3BE}
.accent{fill:#F5B544}
.ok{fill:#6CD4A0}
.fail{fill:#FF7A6B}

@media (prefers-reduced-motion: no-preference){
@keyframes grow0{0%,5.00%{transform:scaleX(0)}34.28%,92.00%{transform:scaleX(1)}97.00%,100%{transform:scaleX(0)}}.grow0{transform-box:fill-box;transform-origin:left;animation:grow0 10s linear infinite}
@keyframes grow1{0%,34.28%{transform:scaleX(0)}48.92%,92.00%{transform:scaleX(1)}97.00%,100%{transform:scaleX(0)}}.grow1{transform-box:fill-box;transform-origin:left;animation:grow1 10s linear infinite}
@keyframes grow2{0%,34.28%{transform:scaleX(0)}40.14%,92.00%{transform:scaleX(1)}97.00%,100%{transform:scaleX(0)}}.grow2{transform-box:fill-box;transform-origin:left;animation:grow2 10s linear infinite}
@keyframes grow3{0%,48.92%{transform:scaleX(0)}55.95%,92.00%{transform:scaleX(1)}97.00%,100%{transform:scaleX(0)}}.grow3{transform-box:fill-box;transform-origin:left;animation:grow3 10s linear infinite}
@keyframes grow4{0%,55.95%{transform:scaleX(0)}61.22%,92.00%{transform:scaleX(1)}97.00%,100%{transform:scaleX(0)}}.grow4{transform-box:fill-box;transform-origin:left;animation:grow4 10s linear infinite}
@keyframes grow5{0%,61.22%{transform:scaleX(0)}64.14%,92.00%{transform:scaleX(1)}97.00%,100%{transform:scaleX(0)}}.grow5{transform-box:fill-box;transform-origin:left;animation:grow5 10s linear infinite}
@keyframes grow6{0%,64.14%{transform:scaleX(0)}70.00%,92.00%{transform:scaleX(1)}97.00%,100%{transform:scaleX(0)}}.grow6{transform-box:fill-box;transform-origin:left;animation:grow6 10s linear infinite}
@keyframes exit{0%,69.00%{opacity:0}73.00%,92.00%{opacity:1}97.00%,100%{opacity:0}}.exit{animation:exit 10s linear infinite}
}
@media (prefers-reduced-motion: reduce){.typed{clip-path:none}.moving{display:none}}
</style>
<rect width="880" height="410" rx="6" fill="#0C1C30"/>
<defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M0 0V20M0 0H20" fill="none" stroke="#14304F" stroke-width="2"/></pattern></defs><rect width="880" height="410" rx="6" fill="url(#grid)"/>
<text x="40" y="44" class="display" font-size="15" font-weight="700">After SIGTERM: drain, close intakes together, then resources in order</text>
<text x="200" y="76" text-anchor="middle" class="mono dim" font-size="10">0 s</text>
<text x="328" y="76" text-anchor="middle" class="mono dim" font-size="10">5 s</text>
<text x="456" y="76" text-anchor="middle" class="mono dim" font-size="10">10 s</text>
<text x="584" y="76" text-anchor="middle" class="mono dim" font-size="10">15 s</text>
<text x="712" y="76" text-anchor="middle" class="mono dim" font-size="10">20 s</text>
<text x="840" y="76" text-anchor="middle" class="mono dim" font-size="10">25 s</text>
<text x="40" y="114" class="mono accent" font-size="11">1 drain</text>
<text x="40" y="144" class="mono accent" font-size="11">2 intakes, together</text>
<text x="40" y="204" class="mono accent" font-size="11">3 resources, in order</text>
<rect class="grow0" x="200" y="100" width="128" height="20" rx="2" fill="#86A3BE" fill-opacity="0.85"/><text x="336" y="114" class="mono" font-size="11.5">/readyz 503, still serving</text>
<rect class="grow1" x="328" y="130" width="64" height="20" rx="2" fill="#5FA8D3" fill-opacity="0.85"/><text x="400" y="144" class="mono" font-size="11.5">http</text>
<rect class="grow2" x="328" y="160" width="25.600000000000023" height="20" rx="2" fill="#5FA8D3" fill-opacity="0.85"/><text x="361.6" y="174" class="mono" font-size="11.5">live</text>
<rect class="grow3" x="392" y="190" width="30.71999999999997" height="20" rx="2" fill="#F5B544" fill-opacity="0.85"/><text x="430.71999999999997" y="204" class="mono" font-size="11.5">queue</text>
<rect class="grow4" x="422.71999999999997" y="220" width="23.04000000000002" height="20" rx="2" fill="#F5B544" fill-opacity="0.85"/><text x="453.76" y="234" class="mono" font-size="11.5">database</text>
<rect class="grow5" x="445.76" y="250" width="12.800000000000011" height="20" rx="2" fill="#F5B544" fill-opacity="0.85"/><text x="466.56" y="264" class="mono" font-size="11.5">health</text>
<rect class="grow6" x="458.56" y="280" width="25.600000000000023" height="20" rx="2" fill="#F5B544" fill-opacity="0.85"/><text x="492.16" y="294" class="mono" font-size="11.5">telemetry</text>
<text x="584.1600000000001" y="294" class="mono ok exit" font-size="13" font-weight="700">exit 0</text>
<path d="M712 86 V314" stroke="#FF7A6B" stroke-width="1" stroke-dasharray="3 4"/><text x="706" y="330" text-anchor="end" class="mono fail" font-size="11">20 s: intakes cut off</text>
<path d="M840 86 V314" stroke="#FF7A6B" stroke-width="1" stroke-dasharray="3 4"/><text x="834" y="348" text-anchor="end" class="mono fail" font-size="11">25 s: deadline, exit 1</text>
<path class="moving" d="M200 86 V304" stroke="#F5B544" stroke-width="2"><animateTransform attributeName="transform" type="translate" dur="10s" repeatCount="indefinite" values="0 0;0 0;284.16 0;284.16 0" keyTimes="0;0.050;0.700;1" calcMode="linear"/></path>
<text x="40" y="370" class="mono dim" font-size="12">Step lengths are illustrative. Defaults: drainDelayMs 5 s, deadlineMs 25 s, the last 5 s kept for the resources.</text>
<text x="40" y="390" class="mono dim" font-size="12">A crash skips the drain and exits 1. A step that throws is logged, the rest still close.</text>
</svg>
