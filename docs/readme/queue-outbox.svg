<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-label="A publish writes the Event in the caller's transaction: on commit it reaches the queue and its Consumer; on rollback neither the row nor the Event exists">
<title>A publish writes the Event in the caller's transaction: on commit it reaches the queue and its Consumer; on rollback neither the row nor the Event exists</title>
<style>
.display{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#DCEBF7}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#DCEBF7}
.dim{fill:#86A3BE}
.accent{fill:#F5B544}
.ok{fill:#6CD4A0}
.fail{fill:#FF7A6B}
.chip{fill:#0C1C30}
.travel{opacity:0}
.rolledback{opacity:0}
.consumer rect{stroke:#6CD4A0}
@media (prefers-reduced-motion: no-preference){
@keyframes travel{0%,12%{transform:translateX(0);opacity:0}14%{transform:translateX(0);opacity:1}26%,44%{transform:translateX(430px);opacity:1}48%,100%{transform:translateX(430px);opacity:0}}.travel{animation:travel 10s ease-in-out infinite}
@keyframes queued{0%,25%{opacity:0}26%,46%{opacity:1}48%,100%{opacity:0}}.queued{animation:queued 10s linear infinite}
@keyframes rows{0%,52%{opacity:1}60%,96%{opacity:.2}100%{opacity:1}}.rows{animation:rows 10s linear infinite}
@keyframes committed{0%,10%{opacity:0}14%,46%{opacity:1}50%,100%{opacity:0}}.committed{animation:committed 10s linear infinite}
@keyframes rolledback{0%,56%{opacity:0}60%,96%{opacity:1}100%{opacity:0}}.rolledback{animation:rolledback 10s linear infinite}
@keyframes consumer{0%,26%{stroke:#5FA8D3}30%,46%{stroke:#6CD4A0}50%,100%{stroke:#5FA8D3}}.consumer rect{animation:consumer 10s linear infinite}
}
@media (prefers-reduced-motion: reduce){.typed{clip-path:none}.moving{display:none}}
</style>
<rect width="880" height="300" rx="6" fill="#0C1C30"/>
<defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M0 0V20M0 0H20" fill="none" stroke="#14304F" stroke-width="2"/></pattern></defs><rect width="880" height="300" rx="6" fill="url(#grid)"/>
<text x="30" y="44" class="display" font-size="15" font-weight="700">The Event is written in the same transaction</text>
<rect x="30" y="66" width="380" height="164" rx="2" fill="#10243D" stroke="#5FA8D3" stroke-width="1.5"/>
<text x="46" y="92" class="mono dim" font-size="12">BEGIN</text>
<g class="rows"><text x="46" y="126" class="mono" font-size="13">INSERT INTO orders …</text><g class=""><rect x="46" y="146" width="300" height="30" rx="2" fill="#F5B544"/><text x="60" y="166" class="mono chip" font-size="12" font-weight="700">publish order.placed, key order_123</text></g></g>
<g class="committed"><text x="46" y="210" class="mono ok" font-size="13" font-weight="700">COMMIT</text></g>
<g class="rolledback"><text x="46" y="210" class="mono fail" font-size="13" font-weight="700">ROLLBACK: neither the row nor the Event exists</text></g>
<line x1="410" y1="161" x2="470" y2="161" stroke="#5FA8D3" stroke-dasharray="3 4"/>
<rect x="460" y="116" width="332" height="90" rx="2" fill="none" stroke="#5FA8D3" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="476" y="136" class="mono dim" font-size="12">the queue, in the same Postgres</text>
<g class="queued"><rect x="476" y="146" width="300" height="30" rx="2" fill="#F5B544"/><text x="490" y="166" class="mono chip" font-size="12" font-weight="700">order.placed · order_123</text></g>
<g class="travel"><rect x="46" y="146" width="300" height="30" rx="2" fill="#F5B544"/><text x="60" y="166" class="mono chip" font-size="12" font-weight="700">order.placed · order_123</text></g>
<line x1="716" y1="206" x2="716" y2="222" stroke="#5FA8D3"/>
<g class="consumer"><rect x="656" y="222" width="120" height="40" rx="2" fill="#10243D" stroke="#5FA8D3" stroke-width="1.5"/><text x="716" y="247" text-anchor="middle" class="display" font-size="13" font-weight="600">Consumer</text></g>
<text x="30" y="282" class="mono dim" font-size="12">No second write to lose: an Event exists only if the write it is about committed.</text>
</svg>
