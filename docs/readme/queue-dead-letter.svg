<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" role="img" aria-label="order_2's second Event fails all five attempts: a copy goes to the dead-letter queue and its key is held while order_1 carries on; once it is given up, the key moves on and #3 is handled">
