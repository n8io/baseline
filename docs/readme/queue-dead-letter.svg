<g class="d01"><rect x="218" y="86" width="44" height="26" rx="2" fill="#F5B544"/><text x="240" y="104" text-anchor="middle" class="mono chip" font-size="12" font-weight="700">#2</text></g>
<g class="d02"><rect x="158" y="86" width="44" height="26" rx="2" fill="#F5B544"/><text x="180" y="104" text-anchor="middle" class="mono chip" font-size="12" font-weight="700">#3</text></g>
<text x="30" y="166" class="mono" font-size="13">order_2</text>
<line x1="120" y1="161" x2="420" y2="161" stroke="#5FA8D3" stroke-dasharray="3 5"/>
<g class="d10"><rect x="278" y="148" width="44" height="26" rx="2" fill="#F5B544"/><text x="300" y="166" text-anchor="middle" class="mono chip" font-size="12" font-weight="700">#1</text></g>
<g class="d11"><rect x="218" y="148" width="44" height="26" rx="2" fill="#F5B544"/><text x="240" y="166" text-anchor="middle" class="mono chip" font-size="12" font-weight="700">#2</text></g>
<g class="d12"><rect x="158" y="148" width="44" height="26" rx="2" fill="#F5B544"/><text x="180" y="166" text-anchor="middle" class="mono chip" font-size="12" font-weight="700">#3</text></g>
