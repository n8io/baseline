<text x="470" y="62" text-anchor="middle" class="mono dim" font-size="12">Consumer</text>
<text x="765" y="62" text-anchor="middle" class="mono dim" font-size="12">handled</text>
<rect x="410" y="232" width="120" height="50" rx="2" fill="#10243D" stroke="#FF7A6B" stroke-dasharray="4 3"/>
<text x="470" y="298" text-anchor="middle" class="mono dim" font-size="11">&lt;queueName&gt;.dead</text>
<text x="30" y="104" class="mono" font-size="13">order_1</text>
<line x1="120" y1="99" x2="420" y2="99" stroke="#5FA8D3" stroke-dasharray="3 5"/>
