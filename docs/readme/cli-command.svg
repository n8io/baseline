<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="880" height="250" role="img" aria-label="cliCreate: the command acme foo create --name x types itself, then a dot runs from the fooCreate operation in openapi.json through the command and the SDK function fooCreate to its JSON on stdout">
<title>cliCreate: the command acme foo create --name x types itself, then a dot runs from the fooCreate operation in openapi.json through the command and the SDK function fooCreate to its JSON on stdout</title>
<style>
.display{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#DCEBF7}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#DCEBF7}
.dim{fill:#86A3BE}
.accent{fill:#F5B544}
.ok{fill:#6CD4A0}
.fail{fill:#FF7A6B}

@media (prefers-reduced-motion: no-preference){
@keyframes glow0{0%,23.33%,33.33%,100%{stroke:#5FA8D3}26.67%{stroke:#F5B544}}.glow0 rect{animation:glow0 9s linear infinite}
@keyframes glow1{0%,40.37%,50.37%,100%{stroke:#5FA8D3}43.70%{stroke:#F5B544}}.glow1 rect{animation:glow1 9s linear infinite}
@keyframes glow2{0%,57.41%,67.41%,100%{stroke:#5FA8D3}60.74%{stroke:#F5B544}}.glow2 rect{animation:glow2 9s linear infinite}
@keyframes glow3{0%,74.44%,84.44%,100%{stroke:#5FA8D3}77.78%{stroke:#F5B544}}.glow3 rect{animation:glow3 9s linear infinite}
}
@media (prefers-reduced-motion: reduce){.typed{clip-path:none}.moving{display:none}}
</style>
<rect width="880" height="250" rx="6" fill="#0C1C30"/>
<defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M0 0V20M0 0H20" fill="none" stroke="#14304F" stroke-width="2"/></pattern></defs><rect width="880" height="250" rx="6" fill="url(#grid)"/>
<clipPath id="cli-command"><rect x="30" y="36" width="0" height="22"><animate attributeName="width" dur="9s" repeatCount="indefinite" values="0;0;213;213;0;0" keyTimes="0.000;0.033;0.222;0.920;0.970;1.000"/></rect></clipPath><text x="30" y="52" class="typed mono " font-size="13" clip-path="url(#cli-command)"><tspan class="accent">$ </tspan>acme foo create --name x</text>
<path d="M125 128 H755" fill="none" stroke="#5FA8D3" stroke-width="1.5" stroke-dasharray="4 5"/>
<circle class="moving" r="7" fill="#F5B544"><animateMotion dur="9s" repeatCount="indefinite" path="M125 128 H755" keyPoints="0;0;1;1" keyTimes="0;0.26666666666666666;0.7777777777777778;1" calcMode="linear"/></circle>
<g class="glow0"><rect x="30" y="96" width="190" height="64" rx="2" fill="#10243D" stroke="#5FA8D3" stroke-width="1.5"/><text x="125" y="126" text-anchor="middle" class="display" font-size="13" font-weight="600">openapi.json</text><text x="125" y="143" text-anchor="middle" class="mono dim" font-size="11">fooCreate, tag foo</text></g>
<g class="glow1"><rect x="240" y="96" width="190" height="64" rx="2" fill="#10243D" stroke="#5FA8D3" stroke-width="1.5"/><text x="335" y="126" text-anchor="middle" class="display" font-size="13" font-weight="600">acme foo create</text><text x="335" y="143" text-anchor="middle" class="mono dim" font-size="11">--name x is the body</text></g>
<g class="glow2"><rect x="450" y="96" width="190" height="64" rx="2" fill="#10243D" stroke="#5FA8D3" stroke-width="1.5"/><text x="545" y="126" text-anchor="middle" class="display" font-size="13" font-weight="600">fooCreate(body, req)</text><text x="545" y="143" text-anchor="middle" class="mono dim" font-size="11">the generated SDK</text></g>
<g class="glow3"><rect x="660" y="96" width="190" height="64" rx="2" fill="#10243D" stroke="#5FA8D3" stroke-width="1.5"/><text x="755" y="126" text-anchor="middle" class="display" font-size="13" font-weight="600">stdout</text><text x="755" y="143" text-anchor="middle" class="mono dim" font-size="11">the response as JSON</text></g>
<text x="30" y="204" class="mono dim" font-size="12">A Problem prints title: code to stderr instead, and the command exits 1.</text>
<text x="30" y="226" class="mono dim" font-size="12">One command per operation; no command code in the Project.</text>
</svg>
