<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-label="A prefixed id types itself, idToUuid turns it into the UUIDv7 a Postgres uuid column stores, and idFromUuid turns it back">
<title>A prefixed id types itself, idToUuid turns it into the UUIDv7 a Postgres uuid column stores, and idFromUuid turns it back</title>
<style>
.display{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#DCEBF7}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#DCEBF7}
.dim{fill:#86A3BE}
.accent{fill:#F5B544}
.ok{fill:#6CD4A0}
.fail{fill:#FF7A6B}

@media (prefers-reduced-motion: no-preference){
@keyframes idmarks{0%,21.11%,97%,100%{opacity:0}25.56%,92%{opacity:1}}.idmarks{animation:idmarks 9s linear infinite}
@keyframes uuidmarks{0%,53.33%,97%,100%{opacity:0}57.78%,92%{opacity:1}}.uuidmarks{animation:uuidmarks 9s linear infinite}
}
@media (prefers-reduced-motion: reduce){.typed{clip-path:none}.moving{display:none}}
</style>
<rect width="880" height="300" rx="6" fill="#0C1C30"/>
<defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M0 0V20M0 0H20" fill="none" stroke="#14304F" stroke-width="2"/></pattern></defs><rect width="880" height="300" rx="6" fill="url(#grid)"/>
<text x="30" y="40" class="display" font-size="15" font-weight="700">idCreate(&quot;foo&quot;)</text>
<clipPath id="id-typed"><rect x="60" y="73" width="0" height="33"><animate attributeName="width" dur="9s" repeatCount="indefinite" values="0;0;446;446;0;0" keyTimes="0.000;0.033;0.211;0.920;0.970;1.000"/></rect></clipPath><text x="60" y="100" class="typed mono " font-size="24" clip-path="url(#id-typed)"><tspan class="accent">foo_</tspan>01m7nmdcagf5brewdswqhsh1ep</text>
<g class="idmarks">
<path d="M60 112 v6 H103.92 v-6" fill="none" stroke="#86A3BE" stroke-width="1"/>
<text x="60" y="134" class="mono dim" font-size="11">prefix</text>
<path d="M118.56 112 v6 H499.20000000000005 v-6" fill="none" stroke="#86A3BE" stroke-width="1"/>
<text x="118.56" y="134" class="mono dim" font-size="11">the UUID in 26 characters of base32</text>
</g>
<text x="640" y="94" class="mono" font-size="13">Id&lt;&quot;foo&quot;&gt;</text>
<text x="640" y="112" class="mono dim" font-size="11">in code: a bar id never passes</text>
<path d="M200 150 V188" stroke="#F5B544" stroke-width="1.5"/><path d="M195 181 L200 188 L205 181" fill="none" stroke="#F5B544" stroke-width="1.5"/>
<text x="212" y="170" class="mono accent" font-size="12">idToUuid(id)</text>
<path d="M470 188 V150" stroke="#F5B544" stroke-width="1.5"/><path d="M465 157 L470 150 L475 157" fill="none" stroke="#F5B544" stroke-width="1.5"/>
<text x="482" y="170" class="mono accent" font-size="12">idFromUuid(&quot;foo&quot;, uuid)</text>
<circle class="moving" r="5" fill="#F5B544"><animateMotion dur="9s" repeatCount="indefinite" path="M200 150 V188" keyPoints="0;0;1;1" keyTimes="0;0.233;0.300;1" calcMode="linear"/><animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.223;0.233;0.300;0.320;1"/></circle>
<clipPath id="uuid-typed"><rect x="60" y="195" width="0" height="33"><animate attributeName="width" dur="9s" repeatCount="indefinite" values="0;0;534;534;0;0" keyTimes="0.000;0.311;0.533;0.920;0.970;1.000"/></rect></clipPath><text x="60" y="222" class="typed mono " font-size="24" clip-path="url(#uuid-typed)">01a1eb46-b150-7957-8771-b9e5e39885d6</text>
<circle class="moving" r="5" fill="#F5B544"><animateMotion dur="9s" repeatCount="indefinite" path="M470 188 V150" keyPoints="0;0;1;1" keyTimes="0;0.600;0.667;1" calcMode="linear"/><animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.590;0.600;0.667;0.687;1"/></circle>
<g class="uuidmarks">
<path d="M60 234 v6 H250.32 v-6" fill="none" stroke="#86A3BE" stroke-width="1"/>
<text x="60" y="256" class="mono dim" font-size="11">48 bits of time: ids sort by when they were made</text>
</g>
<text x="640" y="216" class="mono" font-size="13">uuid</text>
<text x="640" y="234" class="mono dim" font-size="11">in Postgres: 16 bytes, UUIDv7</text>
<text x="30" y="282" class="mono dim" font-size="12">A bad prefix, id or UUID throws a TypeError.</text>
</svg>
