<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" role="img" aria-label="sdkFetch retries: a GET gets a 503 with Retry-After: 1, waits one second, is sent again and resolves its 200; a POST that gets a 503 is sent once and resolves the 503">
<title>sdkFetch retries: a GET gets a 503 with Retry-After: 1, waits one second, is sent again and resolves its 200; a POST that gets a 503 is sent once and resolves the 503</title>
<style>
.display{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#DCEBF7}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#DCEBF7}
.dim{fill:#86A3BE}
.accent{fill:#F5B544}
.ok{fill:#6CD4A0}
.fail{fill:#FF7A6B}

@media (prefers-reduced-motion: no-preference){
@keyframes appear0{0%,17.22%{opacity:0}17.78%,93.33%{opacity:1}100%{opacity:0}}.appear0{animation:appear0 9s linear infinite}
@keyframes appear1{0%,28.33%{opacity:0}28.89%,93.33%{opacity:1}100%{opacity:0}}.appear1{animation:appear1 9s linear infinite}
@keyframes appear2{0%,61.67%{opacity:0}62.22%,93.33%{opacity:1}100%{opacity:0}}.appear2{animation:appear2 9s linear infinite}
@keyframes appear3{0%,17.22%{opacity:0}17.78%,93.33%{opacity:1}100%{opacity:0}}.appear3{animation:appear3 9s linear infinite}
}
@media (prefers-reduced-motion: reduce){.typed{clip-path:none}.moving{display:none}}
</style>
<rect width="880" height="330" rx="6" fill="#0C1C30"/>
<defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M0 0V20M0 0H20" fill="none" stroke="#14304F" stroke-width="2"/></pattern></defs><rect width="880" height="330" rx="6" fill="url(#grid)"/>
<text x="30" y="38" class="mono accent" font-size="13">GET /api/v1/foos/1</text>
<path d="M200 84 H680" fill="none" stroke="#5FA8D3" stroke-width="1.5" stroke-dasharray="4 5"/>
<g class=""><rect x="30" y="52" width="170" height="64" rx="2" fill="#10243D" stroke="#5FA8D3" stroke-width="1.5"/><text x="115" y="82" text-anchor="middle" class="display" font-size="14" font-weight="600">sdkFetch</text><text x="115" y="99" text-anchor="middle" class="mono dim" font-size="11">the SDK's call</text></g>
<g class=""><rect x="680" y="52" width="170" height="64" rx="2" fill="#10243D" stroke="#5FA8D3" stroke-width="1.5"/><text x="765" y="82" text-anchor="middle" class="display" font-size="14" font-weight="600">the API</text><text x="765" y="99" text-anchor="middle" class="mono dim" font-size="11">busy, then not</text></g>
<text x="30" y="186" class="mono accent" font-size="13">POST /api/v1/foos</text>
<path d="M200 232 H680" fill="none" stroke="#5FA8D3" stroke-width="1.5" stroke-dasharray="4 5"/>
<g class=""><rect x="30" y="200" width="170" height="64" rx="2" fill="#10243D" stroke="#5FA8D3" stroke-width="1.5"/><text x="115" y="230" text-anchor="middle" class="display" font-size="14" font-weight="600">sdkFetch</text><text x="115" y="247" text-anchor="middle" class="mono dim" font-size="11">the SDK's call</text></g>
<g class=""><rect x="680" y="200" width="170" height="64" rx="2" fill="#10243D" stroke="#5FA8D3" stroke-width="1.5"/><text x="765" y="230" text-anchor="middle" class="display" font-size="14" font-weight="600">the API</text><text x="765" y="247" text-anchor="middle" class="mono dim" font-size="11">busy</text></g>
<circle class="moving" r="7" fill="#F5B544" opacity="0"><animate attributeName="opacity" dur="9s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.056;0.167"/><animateMotion dur="9s" repeatCount="indefinite" path="M200 84 H680" keyPoints="0;0;1;1" keyTimes="0;0.056;0.167;1" calcMode="linear"/></circle>
<circle class="moving" r="7" fill="#FF7A6B" opacity="0"><animate attributeName="opacity" dur="9s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.167;0.278"/><animateMotion dur="9s" repeatCount="indefinite" path="M680 84 H200" keyPoints="0;0;1;1" keyTimes="0;0.167;0.278;1" calcMode="linear"/></circle>
<circle class="moving" r="7" fill="#F5B544" opacity="0"><animate attributeName="opacity" dur="9s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.400;0.511"/><animateMotion dur="9s" repeatCount="indefinite" path="M200 84 H680" keyPoints="0;0;1;1" keyTimes="0;0.400;0.511;1" calcMode="linear"/></circle>
<circle class="moving" r="7" fill="#6CD4A0" opacity="0"><animate attributeName="opacity" dur="9s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.511;0.622"/><animateMotion dur="9s" repeatCount="indefinite" path="M680 84 H200" keyPoints="0;0;1;1" keyTimes="0;0.511;0.622;1" calcMode="linear"/></circle>
<circle class="moving" r="7" fill="#F5B544" opacity="0"><animate attributeName="opacity" dur="9s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.056;0.167"/><animateMotion dur="9s" repeatCount="indefinite" path="M200 232 H680" keyPoints="0;0;1;1" keyTimes="0;0.056;0.167;1" calcMode="linear"/></circle>
<circle class="moving" r="7" fill="#FF7A6B" opacity="0"><animate attributeName="opacity" dur="9s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.167;0.278"/><animateMotion dur="9s" repeatCount="indefinite" path="M680 232 H200" keyPoints="0;0;1;1" keyTimes="0;0.167;0.278;1" calcMode="linear"/></circle>
<g class="appear0"><text x="440" y="106" text-anchor="middle" class="mono fail" font-size="12">503  Retry-After: 1</text></g>
<g class="appear1"><text x="440" y="122" text-anchor="middle" class="mono dim" font-size="12">waits 1 s, then sends it again</text></g>
<g class="appear2"><text x="440" y="138" text-anchor="middle" class="mono ok" font-size="12">200  resolves { status, data }</text></g>
<g class="appear3"><text x="440" y="254" text-anchor="middle" class="mono fail" font-size="12">503  resolves it: sent once</text></g>
<text x="30" y="310" class="mono dim" font-size="12">GET, HEAD and DELETE retry on a network failure, a timeout, or 408, 429, 500, 502, 503, 504.</text>
</svg>
