<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-label="postgresTransactionRun: a run that returns ok passes BEGIN and the work and commits; a run that returns err or throws rolls back">
<title>postgresTransactionRun: a run that returns ok passes BEGIN and the work and commits; a run that returns err or throws rolls back</title>
<style>
.display{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#DCEBF7}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#DCEBF7}
.dim{fill:#86A3BE}
.accent{fill:#F5B544}
.ok{fill:#6CD4A0}
.fail{fill:#FF7A6B}

@media (prefers-reduced-motion: no-preference){
@keyframes begin{0%,100%{stroke:#5FA8D3}4.00%,15.00%{stroke:#5FA8D3}7.00%{stroke:#F5B544}54.00%,65.00%{stroke:#5FA8D3}57.00%{stroke:#F5B544}}.begin rect{animation:begin 10s linear infinite}
@keyframes work{0%,100%{stroke:#5FA8D3}18.19%,29.19%{stroke:#5FA8D3}21.19%{stroke:#F5B544}68.19%,79.19%{stroke:#5FA8D3}71.19%{stroke:#F5B544}}.work rect{animation:work 10s linear infinite}
}
@media (prefers-reduced-motion: reduce){.typed{clip-path:none}.moving{display:none}}
</style>
<rect width="880" height="300" rx="6" fill="#0C1C30"/>
<defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M0 0V20M0 0H20" fill="none" stroke="#14304F" stroke-width="2"/></pattern></defs><rect width="880" height="300" rx="6" fill="url(#grid)"/>
<text x="40" y="40" class="display" font-size="15" font-weight="700">postgresTransactionRun({ pgPool, work })</text>
<path d="M110 148 H460 L560 88 H620" fill="none" stroke="#5FA8D3" stroke-width="1.5" stroke-dasharray="4 5"/>
<path d="M110 148 H460 L560 208 H620" fill="none" stroke="#5FA8D3" stroke-width="1.5" stroke-dasharray="4 5"/>
<g class="begin"><rect x="30" y="120" width="170" height="56" rx="2" fill="#10243D" stroke="#5FA8D3" stroke-width="1.5"/><text x="115" y="146" text-anchor="middle" class="display" font-size="14" font-weight="600">BEGIN</text><text x="115" y="163" text-anchor="middle" class="mono dim" font-size="11">transaction_timeout 5 s</text></g>
<g class="work"><rect x="260" y="120" width="200" height="56" rx="2" fill="#10243D" stroke="#5FA8D3" stroke-width="1.5"/><text x="360" y="146" text-anchor="middle" class="display" font-size="14" font-weight="600">work(pgClient)</text><text x="360" y="163" text-anchor="middle" class="mono dim" font-size="11">your queries</text></g>
<g class=""><rect x="620" y="60" width="220" height="56" rx="2" fill="#10243D" stroke="#6CD4A0" stroke-width="1.5"/><text x="730" y="86" text-anchor="middle" class="display" font-size="14" font-weight="600">COMMIT</text><text x="730" y="103" text-anchor="middle" class="mono dim" font-size="11">work returned ok(…)</text></g>
<g class=""><rect x="620" y="180" width="220" height="56" rx="2" fill="#10243D" stroke="#FF7A6B" stroke-width="1.5"/><text x="730" y="206" text-anchor="middle" class="display" font-size="14" font-weight="600">ROLLBACK</text><text x="730" y="223" text-anchor="middle" class="mono dim" font-size="11">err(…) or a throw</text></g>
<circle class="moving" r="7" fill="#6CD4A0"><animateMotion dur="10s" repeatCount="indefinite" path="M110 148 H460 L560 88 H620" keyPoints="0;0;1;1" keyTimes="0;0.060;0.380;1" calcMode="linear"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.050;0.060;0.380;0.440;1"/></circle>
<circle class="moving" r="7" fill="#FF7A6B"><animateMotion dur="10s" repeatCount="indefinite" path="M110 148 H460 L560 208 H620" keyPoints="0;0;1;1" keyTimes="0;0.560;0.880;1" calcMode="linear"/><animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.550;0.560;0.880;0.940;1"/></circle>
<text x="40" y="282" class="mono dim" font-size="12">The client throws if anything uses it after the transaction ends.</text>
</svg>
