<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" role="img" aria-label="A write and its Domain event, end to end: a request runs through a context's HTTP route, Use case, Repository and Postgres adapter into one transaction that commits the row and its Domain event; the Worker delivers each Domain event, one at a time per Event key in commit order, to another context's Event handler, whose Use case records it in the Inbox so a repeat is skipped.">
<title>A write and its Domain event, end to end: a request runs through a context's HTTP route, Use case, Repository and Postgres adapter into one transaction that commits the row and its Domain event; the Worker delivers each Domain event, one at a time per Event key in commit order, to another context's Event handler, whose Use case records it in the Inbox so a repeat is skipped.</title>
<style>
.display{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#DCEBF7}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#DCEBF7}
.dim{fill:#86A3BE}
.accent{fill:#F5B544}
.ok{fill:#6CD4A0}
.fail{fill:#FF7A6B}

@media (prefers-reduced-motion: no-preference){
@keyframes server0{0%,1.00%,12.88%,100%{stroke:#5FA8D3}6.00%{stroke:#F5B544}}.server0 rect{animation:server0 8s linear infinite}
@keyframes server1{0%,10.47%,22.34%,100%{stroke:#5FA8D3}15.47%{stroke:#F5B544}}.server1 rect{animation:server1 8s linear infinite}
@keyframes server2{0%,19.94%,31.81%,100%{stroke:#5FA8D3}24.94%{stroke:#F5B544}}.server2 rect{animation:server2 8s linear infinite}
@keyframes server3{0%,29.41%,41.28%,100%{stroke:#5FA8D3}34.41%{stroke:#F5B544}}.server3 rect{animation:server3 8s linear infinite}
@keyframes server4{0%,38.88%,50.75%,100%{stroke:#5FA8D3}43.88%{stroke:#F5B544}}.server4 rect{animation:server4 8s linear infinite}
@keyframes worker0{0%,85.00%,96.88%,100%{stroke:#5FA8D3}90.00%{stroke:#F5B544}}.worker0 rect{animation:worker0 8s linear infinite}
@keyframes worker1{0%,75.53%,87.41%,100%{stroke:#5FA8D3}80.53%{stroke:#F5B544}}.worker1 rect{animation:worker1 8s linear infinite}
@keyframes worker2{0%,66.06%,77.94%,100%{stroke:#5FA8D3}71.06%{stroke:#F5B544}}.worker2 rect{animation:worker2 8s linear infinite}
@keyframes worker3{0%,56.59%,68.47%,100%{stroke:#5FA8D3}61.59%{stroke:#F5B544}}.worker3 rect{animation:worker3 8s linear infinite}
@keyframes worker4{0%,47.12%,59.00%,100%{stroke:#5FA8D3}52.12%{stroke:#F5B544}}.worker4 rect{animation:worker4 8s linear infinite}
@keyframes commit{0%,42.63%{opacity:.3}45.75%,60.13%{opacity:1}67.63%,100%{opacity:.3}}.commit{animation:commit 8s linear infinite}
}
@media (prefers-reduced-motion: reduce){.typed{clip-path:none}.moving{display:none}}
</style>
<rect width="880" height="330" rx="6" fill="#0C1C30"/>
<defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M0 0V20M0 0H20" fill="none" stroke="#14304F" stroke-width="2"/></pattern></defs><rect width="880" height="330" rx="6" fill="url(#grid)"/>
<text x="30" y="44" class="display" font-size="15" font-weight="700">A write and its Event, end to end</text>
<text x="850" y="44" text-anchor="end" class="mono dim" font-size="12">Server</text>
<text x="850" y="312" text-anchor="end" class="mono dim" font-size="12">Worker</text>
<path d="M100 102 H780 V250 H100" fill="none" stroke="#5FA8D3" stroke-width="1.5" stroke-dasharray="4 5"/>
<g class="server0"><rect x="30" y="74" width="140" height="56" rx="2" fill="#10243D" stroke="#5FA8D3" stroke-width="1.5"/><text x="100" y="100" text-anchor="middle" class="display" font-size="14" font-weight="600">HTTP route</text><text x="100" y="117" text-anchor="middle" class="mono dim" font-size="11">inbound adapter</text></g>
<g class="server1"><rect x="200" y="74" width="140" height="56" rx="2" fill="#10243D" stroke="#5FA8D3" stroke-width="1.5"/><text x="270" y="100" text-anchor="middle" class="display" font-size="14" font-weight="600">Use case</text><text x="270" y="117" text-anchor="middle" class="mono dim" font-size="11">calls a model function</text></g>
<g class="server2"><rect x="370" y="74" width="140" height="56" rx="2" fill="#10243D" stroke="#5FA8D3" stroke-width="1.5"/><text x="440" y="100" text-anchor="middle" class="display" font-size="14" font-weight="600">Repository</text><text x="440" y="117" text-anchor="middle" class="mono dim" font-size="11">a port</text></g>
<g class="server3"><rect x="540" y="74" width="140" height="56" rx="2" fill="#10243D" stroke="#5FA8D3" stroke-width="1.5"/><text x="610" y="100" text-anchor="middle" class="display" font-size="14" font-weight="600">Postgres</text><text x="610" y="117" text-anchor="middle" class="mono dim" font-size="11">outbound adapter</text></g>
<g class="server4"><rect x="710" y="74" width="140" height="56" rx="2" fill="#10243D" stroke="#5FA8D3" stroke-width="1.5"/><text x="780" y="100" text-anchor="middle" class="display" font-size="14" font-weight="600">Transaction</text><text x="780" y="117" text-anchor="middle" class="mono dim" font-size="11">the row + its Event</text></g>
<g class="worker0"><rect x="30" y="222" width="140" height="56" rx="2" fill="#10243D" stroke="#5FA8D3" stroke-width="1.5"/><text x="100" y="248" text-anchor="middle" class="display" font-size="14" font-weight="600">Inbox</text><text x="100" y="265" text-anchor="middle" class="mono dim" font-size="11">same transaction</text></g>
<g class="worker1"><rect x="200" y="222" width="140" height="56" rx="2" fill="#10243D" stroke="#5FA8D3" stroke-width="1.5"/><text x="270" y="248" text-anchor="middle" class="display" font-size="14" font-weight="600">Use case</text><text x="270" y="265" text-anchor="middle" class="mono dim" font-size="11">skips a repeat</text></g>
<g class="worker2"><rect x="370" y="222" width="140" height="56" rx="2" fill="#10243D" stroke="#5FA8D3" stroke-width="1.5"/><text x="440" y="248" text-anchor="middle" class="display" font-size="14" font-weight="600">Event handler</text><text x="440" y="265" text-anchor="middle" class="mono dim" font-size="11">another context</text></g>
<g class="worker3"><rect x="540" y="222" width="140" height="56" rx="2" fill="#10243D" stroke="#5FA8D3" stroke-width="1.5"/><text x="610" y="248" text-anchor="middle" class="display" font-size="14" font-weight="600">Worker</text><text x="610" y="265" text-anchor="middle" class="mono dim" font-size="11">per Event key</text></g>
<g class="worker4"><rect x="710" y="222" width="140" height="56" rx="2" fill="#10243D" stroke="#5FA8D3" stroke-width="1.5"/><text x="780" y="248" text-anchor="middle" class="display" font-size="14" font-weight="600">Domain event</text><text x="780" y="265" text-anchor="middle" class="mono dim" font-size="11">in the queue</text></g>
<g class="commit"><rect x="500" y="152" width="260" height="26" rx="2" fill="#0C1C30" stroke="#6CD4A0"/>
<text x="630" y="170" text-anchor="middle" class="mono ok" font-size="12">COMMIT: the write + its Event</text>
</g>
<text x="30" y="170" class="mono dim" font-size="12">A rollback drops the Event with the write.</text>
<text x="30" y="312" class="mono dim" font-size="12">Same Event key: one at a time, in commit order.</text>
<circle class="moving" r="7" fill="#F5B544"><animateMotion dur="8s" repeatCount="indefinite" path="M100 102 H780 V250 H100" keyPoints="0;0;1;1" keyTimes="0;0.06;0.9;1" calcMode="linear"/></circle>
</svg>
