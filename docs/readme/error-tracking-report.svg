<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" role="img" aria-label="One logger.error call with a DatabaseError whose message holds an email address: the log line and the Error report both carry its class, code, constraint, frames and trace id, and the message is struck out of both">
<title>One logger.error call with a DatabaseError whose message holds an email address: the log line and the Error report both carry its class, code, constraint, frames and trace id, and the message is struck out of both</title>
<style>
.display{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#DCEBF7}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#DCEBF7}
.dim{fill:#86A3BE}
.accent{fill:#F5B544}
.ok{fill:#6CD4A0}
.fail{fill:#FF7A6B}

@media (prefers-reduced-motion: no-preference){
@keyframes strike{0%,10.00%{transform:scaleX(0)}16.67%,93.33%{transform:scaleX(1)}97.78%,100%{transform:scaleX(0)}}.strike{transform-box:fill-box;transform-origin:left;animation:strike 9s linear infinite}
@keyframes logLine0{0%,31.11%{opacity:0}34.44%,93.33%{opacity:1}97.78%,100%{opacity:0}}.logLine0{animation:logLine0 9s linear infinite}
@keyframes logLine1{0%,35.00%{opacity:0}38.33%,93.33%{opacity:1}97.78%,100%{opacity:0}}.logLine1{animation:logLine1 9s linear infinite}
@keyframes logLine2{0%,38.89%{opacity:0}42.22%,93.33%{opacity:1}97.78%,100%{opacity:0}}.logLine2{animation:logLine2 9s linear infinite}
@keyframes logLine3{0%,42.78%{opacity:0}46.11%,93.33%{opacity:1}97.78%,100%{opacity:0}}.logLine3{animation:logLine3 9s linear infinite}
@keyframes reportLine0{0%,51.11%{opacity:0}54.44%,93.33%{opacity:1}97.78%,100%{opacity:0}}.reportLine0{animation:reportLine0 9s linear infinite}
@keyframes reportLine1{0%,55.00%{opacity:0}58.33%,93.33%{opacity:1}97.78%,100%{opacity:0}}.reportLine1{animation:reportLine1 9s linear infinite}
@keyframes reportLine2{0%,58.89%{opacity:0}62.22%,93.33%{opacity:1}97.78%,100%{opacity:0}}.reportLine2{animation:reportLine2 9s linear infinite}
@keyframes reportLine3{0%,62.78%{opacity:0}66.11%,93.33%{opacity:1}97.78%,100%{opacity:0}}.reportLine3{animation:reportLine3 9s linear infinite}
}
@media (prefers-reduced-motion: reduce){.typed{clip-path:none}.moving{display:none}}
</style>
<rect width="880" height="440" rx="6" fill="#0C1C30"/>
<defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M0 0V20M0 0H20" fill="none" stroke="#14304F" stroke-width="2"/></pattern></defs><rect width="880" height="440" rx="6" fill="url(#grid)"/>
<text x="40" y="44" class="display" font-size="15" font-weight="700">One error logged, one Error report, no message</text>
<text x="40" y="68" class="mono dim" font-size="12">The error's message holds input text. Neither output carries it.</text>
<rect x="40" y="92" width="360" height="96" rx="2" fill="#10243D" stroke="#F5B544" stroke-width="1.5"/>
<text x="54" y="118" class="mono" font-size="12">logger.error({ err })</text>
<text x="54" y="142" class="mono dim" font-size="11">err: DatabaseError, code 23505</text>
<text x="54" y="166" class="mono fail" font-size="11">message: &quot;failed for ana@example.com&quot;</text>
<rect class="strike" x="54" y="161" width="262" height="1.5" fill="#FF7A6B"/>
<path d="M400 140 H470" fill="none" stroke="#5FA8D3" stroke-width="1.5" stroke-dasharray="4 5"/>
<path d="M220 188 V299 H470" fill="none" stroke="#5FA8D3" stroke-width="1.5" stroke-dasharray="4 5"/>
<g class=""><rect x="125" y="283" width="190" height="32" rx="2" fill="#10243D" stroke="#5FA8D3" stroke-width="1.5"/><text x="220" y="304" text-anchor="middle" class="display" font-size="12" font-weight="600">loggerErrorListen</text></g>
<rect x="470" y="92" width="370" height="114" rx="2" fill="#10243D" stroke="#5FA8D3" stroke-width="1.5"/><text x="484" y="112" class="mono accent" font-size="11">stdout · OTLP log</text><text x="484" y="134" class="mono logLine0" font-size="11.5">&quot;level&quot;:50,&quot;msg&quot;:&quot;DatabaseError&quot;</text><text x="484" y="154" class="mono logLine1" font-size="11.5">&quot;err&quot;:{&quot;type&quot;:&quot;DatabaseError&quot;,&quot;code&quot;:&quot;23505&quot;,</text><text x="484" y="174" class="mono logLine2" font-size="11.5">&quot;constraint&quot;:&quot;foo_email_key&quot;,&quot;stack&quot;:&quot;at …&quot;}</text><text x="484" y="194" class="mono logLine3" font-size="11.5">&quot;trace_id&quot;:&quot;4bf92f35…&quot;</text>
<rect x="470" y="250" width="370" height="114" rx="2" fill="#10243D" stroke="#5FA8D3" stroke-width="1.5"/><text x="484" y="270" class="mono accent" font-size="11">Error report</text><text x="484" y="292" class="mono reportLine0" font-size="11.5">DatabaseError   error.code 23505</text><text x="484" y="312" class="mono reportLine1" font-size="11.5">error.constraint foo_email_key</text><text x="484" y="332" class="mono reportLine2" font-size="11.5">frames  at fooCreate (…), at …</text><text x="484" y="352" class="mono reportLine3" font-size="11.5">trace_id 4bf92f35…  → links to its trace</text>
<circle class="moving" r="6" fill="#F5B544"><animateMotion dur="9s" repeatCount="indefinite" path="M400 140 H470" keyPoints="0;0;1;1" keyTimes="0;0.17;0.3;1" calcMode="linear"/></circle>
<circle class="moving" r="6" fill="#F5B544"><animateMotion dur="9s" repeatCount="indefinite" path="M220 188 V299 H470" keyPoints="0;0;1;1" keyTimes="0;0.33;0.5;1" calcMode="linear"/></circle>
<text x="40" y="400" class="mono dim" font-size="12">report() returns at once and never throws. A slow or failing error tracker never slows a request.</text>
<text x="40" y="420" class="mono dim" font-size="12">Credentials in log fields are [Redacted]; an error leaves only as its class, code, constraint and frames.</text>
</svg>
